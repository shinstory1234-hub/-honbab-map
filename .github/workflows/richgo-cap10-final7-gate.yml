name: Final Richgo cap10 1822 apartment validation and build
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-final7-gate.yml
      - scripts/test-richgo-cap10-final7.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 1822 audit outcomes and original 6억 tab isolation
        run: |
          node scripts/test-richgo-cap10-final7.cjs
          node scripts/test-richgo-cap10-final.cjs
          node scripts/test-richgo-6to10-crossband.cjs
          node scripts/test-richgo-band10-audit.cjs
      - name: Verify final app build without relaxing gzip or request ceiling
        run: |
          npm ci --ignore-scripts
          npm run build

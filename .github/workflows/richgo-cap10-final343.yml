name: Richgo cap10 final 343 missing identity verification
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-final343.yml
      - scripts/audit-richgo-cap10-final343.cjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: richgo-cap10-final343-audit
  cancel-in-progress: false
jobs:
  missing343:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD: ${{ matrix.shard }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and frozen 343 target scope
        run: |
          node --check scripts/audit-richgo-cap10-final343.cjs
          node scripts/test-richgo-cap10-final.cjs
      - name: Reconcile unresolved apartments through public named pages and indexed aliases
        run: node scripts/audit-richgo-cap10-final343.cjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: richgo-final343-${{ matrix.shard }}
          path: /tmp/richgo-cap10-final343-part${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: warn

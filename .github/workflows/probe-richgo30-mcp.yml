name: Richgo cap30 named-source lookup diagnostics
on:
  push:
    branches:
      - audit/richgo-25to30-top300-20261118
    paths:
      - 'scripts/probe-richgo30-mcp.cjs'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/probe-richgo30-mcp.cjs

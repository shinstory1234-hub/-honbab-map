name: Richgo cap15 third-pass exact block and alias matching
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-remaining814-thirdpass.yml
      - scripts/richgo15-remaining814-thirdpass.cjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10 complex IDs against public Richgo site and block numbers
        run: node scripts/richgo15-remaining814-thirdpass.cjs
      - name: Save third-pass audit proof and verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/richgo-10to15-remaining814-20261118.csv
          git add docs/richgo-10to15-verified-corrections.json docs/richgo-10to15-remaining814-thirdpass-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: verify 10 exact Richgo block ID matches and preserve aggregate exception [skip ci]"
            git pull --rebase origin audit/richgo-10to15-top300-20261118
            git push origin HEAD:audit/richgo-10to15-top300-20261118
          fi

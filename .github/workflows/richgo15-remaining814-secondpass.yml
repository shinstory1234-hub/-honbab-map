name: Richgo cap15 second-pass review of 51 unresolved aliases
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-remaining814-secondpass.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 51 unmatched aliases and split building groupings against Richgo details
        run: node scripts/richgo15-remaining814-secondpass.cjs
      - name: Flag risky already-matched complexes
        run: node scripts/richgo15-remaining814-risk-review.cjs
      - name: Save verified corrections and source review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/richgo-10to15-remaining814-20261118.csv
          git add docs/richgo-10to15-verified-corrections.json docs/richgo-10to15-remaining814-secondary-evidence.json docs/richgo-10to15-remaining814-risk-review.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: finish 814 site reviews with source links and safe identity classification [skip ci]"
            git pull --rebase origin audit/richgo-10to15-top300-20261118
            git push origin HEAD:audit/richgo-10to15-top300-20261118
          fi

name: Complete Richgo 15-20b 300-apartment field audit
on:
  push:
    branches: [audit/richgo-15to20-top300-20261118]
    paths:
      - scripts/finalize-richgo20-audit.cjs
      - .github/workflows/finalize-richgo20-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Verify all 300 selected property detail pages and reconcile factual differences
        run: node scripts/finalize-richgo20-audit.cjs
      - name: Commit verified audit evidence and corrected source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/richgo-15to20-top300-audit-20261118.csv docs/richgo20-verified-full-20261118.json docs/richgo20-data-differences-20261118.json public/apt-univ20.js
          if ! git diff --cached --quiet; then
            git commit -m "data: finish all 300 Richgo 15-20b audits and repair verified raw fields"
            git push origin HEAD:audit/richgo-15to20-top300-20261118
          fi

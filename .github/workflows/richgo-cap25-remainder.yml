name: Richgo cap25 rank301-372 remaining audit
on:
  push:
    branches:
      - audit/richgo-20to25-top300-20261118
    paths:
      - 'scripts/richgo-cap25-remainder.mjs'
      - '.github/workflows/richgo-cap25-remainder.yml'
permissions:
  contents: write
concurrency:
  group: richgo-cap25-remaining
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Research remaining 72 using public Richgo locations and coordinates
        run: node scripts/richgo-cap25-remainder.mjs
      - name: Save all audit evidence on branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/richgo-cap25-rank301-372-summary.json docs/richgo-20to25-rank301-372-audit-20261118.json
          git add -f docs/richgo-20to25-rank301-372-audit-20261118.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit: report Richgo source and coordinate match of remaining 72 complexes"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin HEAD:"$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" = "4" ]; then exit 1; fi
              sleep 3
            done
          fi

name: Richgo cap10 third pass official dong catalog reconciliation
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-thirdpass.yml
      - scripts/audit-richgo-cap10-thirdpass.cjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: richgo-cap10-thirdpass
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD: ${{ matrix.shard }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh source data and check second-pass evidence
        run: |
          for attempt in $(seq 1 30); do
            if [ -f "docs/richgo-6to10-secondpass-parts/part0${SHARD}.json" ]; then exit 0; fi
            git fetch origin audit/richgo-6to10-top300-20261118
            git checkout -f FETCH_HEAD
            sleep 10
          done
          echo 'Missing second-pass evidence'; exit 1
      - name: Verify script syntax
        run: node --check scripts/audit-richgo-cap10-thirdpass.cjs
      - name: Compare unresolved apartments against public dong-level Richgo catalogs
        run: node scripts/audit-richgo-cap10-thirdpass.cjs
      - name: Save third-pass output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: richgo-cap10-thirdpass-shard-${{ matrix.shard }}
          path: /tmp/richgo-cap10-thirdpass${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: warn

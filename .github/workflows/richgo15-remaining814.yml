name: Richgo cap15 remaining 814 public-page parallel audit
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-remaining814.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build exactly 814 remaining distinct complexes from cap15 universe
        run: node scripts/richgo15-seed-remaining814.cjs
      - name: Audit 814 in parallel against public Richgo region and complex pages
        id: crawl
        run: |
          set +e
          node scripts/richgo15-remaining814-crawl.cjs --concurrency=8 --limit=814 | tee /tmp/richgo814-crawl.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Always commit individual evidence including incomplete cases
        if: always() && steps.crawl.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/richgo-10to15-remaining814-20261118.csv
          git add docs/richgo-10to15-verified-corrections.json
          if [ -f docs/richgo-10to15-remaining814-crawl-status.json ]; then
            git add docs/richgo-10to15-remaining814-crawl-status.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "audit: verify remaining 814 Richgo cap15 complexes and record original source links [skip ci]"
            git pull --rebase origin audit/richgo-10to15-top300-20261118
            git push origin HEAD:audit/richgo-10to15-top300-20261118
          fi
      - name: Fail if upstream prevented full 814 crawl
        run: |
          if [ "${{ steps.crawl.outputs.status }}" != "0" ]; then
            echo "Richgo 814 crawler failed, saved partial evidence and preserved corrected values."
            exit 1
          fi

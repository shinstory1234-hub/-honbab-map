name: Richgo cap15 fourth-pass seven public source identity verifications
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-remaining814-fourthpass.yml
      - scripts/richgo15-remaining814-fourthpass.cjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 7 Richgo complex identities using public detail facts
        run: node scripts/richgo15-remaining814-fourthpass.cjs
      - name: Save only proven corrections and exceptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/richgo-10to15-remaining814-20261118.csv
          git add docs/richgo-10to15-verified-corrections.json docs/richgo-10to15-remaining814-fourthpass-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: prove seven apartment aliases and explicitly protect merged-complex exception [skip ci]"
            git pull --rebase origin audit/richgo-10to15-top300-20261118
            git push origin HEAD:audit/richgo-10to15-top300-20261118
          fi

name: Richgo cap10 25 same-identity household corrections and build gate
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-units25.yml
      - scripts/resolve-richgo-cap10-final343-units25.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source status and merge 25 same-building count discrepancies
        run: |
          node --check scripts/resolve-richgo-cap10-final343-units25.cjs
          node scripts/resolve-richgo-cap10-final343-units25.cjs
      - name: Verify all 1822 records and source facts after commit
        run: |
          git fetch origin audit/richgo-6to10-top300-20261118
          git checkout -f FETCH_HEAD
          node scripts/test-richgo-cap10-final.cjs
          node scripts/test-richgo-6to10-crossband.cjs
          node scripts/test-richgo-band10-audit.cjs
      - name: Keep initial-load speed ceiling fixed and verify build
        run: |
          npm ci --ignore-scripts
          npm run build

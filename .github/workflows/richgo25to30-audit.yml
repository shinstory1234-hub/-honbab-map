name: Richgo 25-30억원 audit smoke test
on:
  push:
    branches:
      - audit/richgo-25to30-top300-20261118
  pull_request:
    paths:
      - 'public/apt-richgo30-fix.js'
      - 'public/apt-map.html'
      - 'scripts/test-richgo25to30-verified.cjs'
      - 'docs/richgo-25to30-audit-20261118*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check evidence-matched FAR and other-cap isolation
        run: node scripts/test-richgo25to30-verified.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build and enforce unchanged speed budgets
        run: npm run build

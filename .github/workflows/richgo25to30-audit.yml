name: Richgo 25-30억원 audit smoke test
on:
  push:
    branches:
      - audit/richgo-25to30-top300-20261118
    paths:
      - '.github/workflows/richgo25to30-audit.yml'
      - 'scripts/export-richgo-25to30-targets.mjs'
      - 'scripts/audit-richgo-25to30.py'
      - 'scripts/test-richgo25to30-verified.cjs'
  pull_request:
    paths:
      - 'public/apt-richgo30-fix.js'
      - 'public/apt-map.html'
      - 'scripts/test-richgo25to30-verified.cjs'
      - 'docs/richgo-25to30-audit-20261118*'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check evidence-matched FAR and other-cap isolation
        run: node scripts/test-richgo25to30-verified.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build and enforce unchanged speed budgets
        run: npm run build
      - name: Export exact live top300 apartment complexes (read-only)
        run: |
          node scripts/export-richgo-25to30-targets.mjs > /tmp/richgo25to30-export.log 2>&1 || { echo 'Exact rank export unavailable; fall back to static candidate audit'; tail -c 2000 /tmp/richgo25to30-export.log; }
          if [ -s /tmp/richgo25to30-rank-targets.json ]; then grep TARGET_SUMMARY /tmp/richgo25to30-export.log | head -c 2000; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install public page parsing libraries
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Audit ALL visible 25-to-30b target apartments against Richgo, do not stop after 14
        run: |
          python -m py_compile scripts/audit-richgo-25to30.py
          python scripts/audit-richgo-25to30.py
      - name: Commit audit data on isolated branch only
        if: always()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/richgo-25to30-direct-audit-20261118.csv docs/richgo-25to30-direct-summary-20261118.json || true
          if ! git diff --cached --quiet; then git commit -m "audit: complete full cap30 direct page attempts and save evidence"; git pull --rebase origin audit/richgo-25to30-top300-20261118; git push origin HEAD:audit/richgo-25to30-top300-20261118; fi
      - name: Upload current top300 extraction for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: richgo25to30-current-ranked-apartments
          path: /tmp/richgo25to30-rank-targets.json
          if-no-files-found: warn
          retention-days: 2

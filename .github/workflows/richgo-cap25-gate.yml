name: Richgo cap25 audit data and performance gate
on:
  push:
    branches:
      - audit/richgo-20to25-top300-20261118
    paths:
      - 'public/apt-richgo25.js'
      - 'public/apt-invest25.js'
      - 'scripts/build-apt-assets.mjs'
      - 'public/apt-map.html'
      - 'scripts/test-richgo-20to25-verified.cjs'
      - 'scripts/test-richgo-cap25-300.cjs'
      - 'scripts/test-richgo-cap25-372.cjs'
      - '.github/workflows/richgo-cap25-gate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify 18 legacy manually checked and full 300 source corrections
        run: |
          node scripts/test-richgo-20to25-verified.cjs
          node scripts/test-richgo-cap25-300.cjs
          node scripts/test-richgo-cap25-372.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build with unchanged payload speed budget
        run: npm run build

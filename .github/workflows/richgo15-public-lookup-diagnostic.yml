name: Diagnose public Richgo and Naver lookup routes
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-public-lookup-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose HTTP access and publishing discovery
        run: |
          node - <<'JS'
          (async()=>{
            const urls=[
              "https://m.richgo.ai/robots.txt",
              "https://m.richgo.ai/sitemap.xml",
              "https://m.richgo.ai/danji_detail.xml",
              "https://m.richgo.ai/realty/danji/a2VEQie",
              "https://www.google.com/search?q="+encodeURIComponent("site:m.richgo.ai/realty/danji/ DMC파크뷰자이3단지 남가좌동"),
              "https://www.google.com/search?q="+encodeURIComponent("site:m.richgo.ai/realty/danji/ 한솔마을4단지 정자동"),
              "https://www.google.com/search?q="+encodeURIComponent("site:m.richgo.ai/realty/danji/ 철산래미안자이"),
              "https://search.naver.com/search.naver?query="+encodeURIComponent("site:m.richgo.ai/realty/danji 철산래미안자이"),
              "https://www.bing.com/search?q="+encodeURIComponent("site:m.richgo.ai/realty/danji 철산래미안자이"),
              "https://search.daum.net/search?w=tot&q="+encodeURIComponent("site:m.richgo.ai/realty/danji 철산래미안자이")
            ];
            for(const u of urls){
              try{const r=await fetch(u,{headers:{"user-agent":"Mozilla/5.0 (compatible; AptMapAudit/1.0; +https://github.com/shinstory1234-hub/-honbab-map)"}});
                const t=await r.text();
                const match=t.match(/<loc>[^<]*<\/loc>|a2VEQie|용적률|robots|sitemap|<title[^>]*>[^<]*/i);
                console.log(JSON.stringify({url:u,status:r.status,bytes:t.length,contentType:r.headers.get('content-type'),matched:match?.[0]?.slice(0,130),prefix:t.slice(0,u.includes('robots.txt')?3300:u.includes('danji_detail.xml')?900:170),count:(t.match(/<loc>/g)||[]).length}));
                if(u.includes('google.com')||u.includes('search.naver')||u.includes('bing.com')||u.includes('search.daum')){const ids=[...new Set(t.match(new RegExp('m.richgo.ai/realty/danji/[a-zA-Z0-9]{7}','g'))||[])].slice(0,15);console.log('GOOGLE_RICHGO_IDS',JSON.stringify(ids).slice(0,2200));const k=t.indexOf('richgo.ai/realty/danji/');console.log('CONTEXT',t.slice(Math.max(0,k-130),k+200));}
                if(u.includes('a2VEQie')&&r.status===200){const k=t.indexOf('용적률');console.log('PAGE_RATIO_HTML',t.slice(Math.max(0,k-350),k+480));}
                if(u.includes('robots.txt'))console.log('ROBOTS_TAIL',t.slice(-600));
              }catch(e){console.log(JSON.stringify({url:u,error:String(e).slice(0,300)}))}
            }
          })()
          JS

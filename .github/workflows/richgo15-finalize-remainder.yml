name: Complete remaining Richgo top300 identity verification
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-finalize-remainder.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare 30 remaining complexes with Richgo official public pages
        run: node scripts/richgo15-finalize-remainder.cjs
      - name: Commit source-linked and type-safe 300-complex audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/richgo-10to15-top300-20261118.csv docs/richgo-10to15-verified-corrections.json docs/richgo-10to15-remaining-final-evidence.json docs/richgo-10to15-crawl-status.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: finish 300 public-page comparisons with explicit combined-complex exceptions [skip ci]"
            git pull --rebase origin audit/richgo-10to15-top300-20261118
            git push origin HEAD:audit/richgo-10to15-top300-20261118
          fi

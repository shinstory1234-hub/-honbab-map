## Total source inventory 626 (554 ranked, 72 not ranked); verify unreviewed 326.
name: Audit remaining 326 of 626 Richgo apartments
on:
  push:
    branches: [audit/richgo-15to20-top300-20261118]
    paths:
      - scripts/collect-richgo20-rest.cjs
      - .github/workflows/collect-richgo20-rest.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Enumerate full raw 626 apartments, remaining 326
        run: node scripts/prepare-richgo20-rest.cjs
      - name: Match and verify remaining apartments against Richgo public pages
        run: node scripts/collect-richgo20-rest.cjs
      - name: Commit full coverage check records on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/richgo-15to20-remaining326-audit-20261118.csv
          git add docs/richgo20-remaining326-candidates-20261118.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: collect Richgo fact checks for remaining 326 out of 626"
            git push origin HEAD:audit/richgo-15to20-top300-20261118
          fi

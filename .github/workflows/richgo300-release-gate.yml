name: Richgo 300 verified correction release gate
on:
  push:
    branches:
      - fix/richgo-under6-verified300-20261118
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare 300 verified Richgo fields and block over-6억 mutations
        run: node scripts/test-richgo-under6-verified300.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Compile generated price-band assets and enforce payload speed budget
        run: npm run build

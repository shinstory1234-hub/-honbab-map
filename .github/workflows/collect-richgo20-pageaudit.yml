name: Richgo top300 targeted public page audit
on:
  push:
    branches: [audit/richgo-15to20-top300-20261118]
    paths:
      - scripts/collect-richgo20-pageaudit.cjs
      - .github/workflows/collect-richgo20-pageaudit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare the 300 named apartments against public pages
        run: node scripts/collect-richgo20-pageaudit.cjs
      - name: Commit evidence on independent audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/richgo-15to20-top300-audit-20261118.csv docs/richgo20-remaining-candidates-20261118.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: append actual Richgo page crosschecks for top300"
            git push origin HEAD:audit/richgo-15to20-top300-20261118
          fi

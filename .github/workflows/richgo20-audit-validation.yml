name: Richgo 15-20b apartment audit validation
on:
  push:
    branches:
      - audit/richgo-15to20-top300-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify 300 unique complexes, documented Richgo fields, and price-band isolation
        run: node scripts/test-richgo20-top300.cjs
      - name: Verify all 626 complexes and 621 Richgo FAR facts
        run: node scripts/test-richgo20-full626.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build and enforce mobile payload performance budget
        run: npm run build

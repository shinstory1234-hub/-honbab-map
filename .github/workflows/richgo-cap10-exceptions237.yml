name: Complete cap10 review with 237 exception evidence
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-exceptions237.yml
      - scripts/classify-richgo-cap10-remaining237.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh branch after final two year corrections
        run: |
          for attempt in $(seq 1 70); do
            if grep -q '"name": "홍제역해링턴플레이스"' scripts/richgo-band10-corrections.json && [ -f docs/richgo-6to10-final343-years2-20261118.json ]; then exit 0; fi
            git fetch origin audit/richgo-6to10-top300-20261118
            git checkout -f FETCH_HEAD
            sleep 10
          done
          echo 'Year corrections missing'; exit 1
      - name: Categorize all remaining 237 evidence conflicts
        run: |
          node --check scripts/classify-richgo-cap10-remaining237.cjs
          node scripts/classify-richgo-cap10-remaining237.cjs
      - name: Confirm complete 1822 audit, no other price-band mutations
        run: |
          git fetch origin audit/richgo-6to10-top300-20261118
          git checkout -f FETCH_HEAD
          node scripts/test-richgo-cap10-final.cjs
          node scripts/test-richgo-6to10-crossband.cjs
          node scripts/test-richgo-band10-audit.cjs

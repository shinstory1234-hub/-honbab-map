name: Read-only Richgo audit (300 apartments)
on:
  push:
    branches:
      - audit/richgo-under6-300-20261118

permissions:
  contents: read

jobs:
  richgo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install lightweight HTML parsing dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Static validation
        run: python -m py_compile scripts/audit-richgo-under6-300.py
      - name: Audit 300 distinct snapshot-ranked apartments in parallel
        run: python scripts/audit-richgo-under6-300.py
      - name: Upload audit report without modifying website or master
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: richgo-under6-300-audit-20261118
          path: |
            /tmp/richgo_under6_300_audit.csv
            /tmp/richgo_under6_300_summary.json
          if-no-files-found: warn
          retention-days: 1

name: Confirm cap10 exact-match Richgo completion years
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-years2.yml
      - scripts/resolve-richgo-cap10-final343-years2.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two year corrections and preserve evidence
        run: |
          node --check scripts/resolve-richgo-cap10-final343-years2.cjs
          node scripts/resolve-richgo-cap10-final343-years2.cjs
      - name: Verify source identities
        run: |
          git fetch origin audit/richgo-6to10-top300-20261118
          git checkout -f FETCH_HEAD
          node scripts/test-richgo-cap10-final.cjs
          node scripts/test-richgo-6to10-crossband.cjs
          node scripts/test-richgo-band10-audit.cjs
      - name: Enforce existing network speed limit
        run: |
          npm ci --ignore-scripts
          npm run build

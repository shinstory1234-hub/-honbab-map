name: Apartment Map Read-only Audit

on:
  push:
    branches:
      - audit/read-only-rank-validation-20261111

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Node.js
        run: node --version
      - name: Run isolated auditor tests
        run: |
          node scripts/test-apt-ranks-audit.mjs
          node scripts/test-apt-snapshots-audit.mjs
          node scripts/test-apt-policy-audit.mjs
      - name: Analyze scoring policy without any deployment
        run: node scripts/audit-apt-policy.mjs --out /tmp/apt-policy-audit.json
      - name: Analyze stored historical snapshots
        run: |
          node scripts/audit-apt-snapshots.mjs --out /tmp/apt-snapshot-audit.json > /tmp/apt-snapshot-summary.json || {
            echo "Historical snapshot anomalies found. Inspect artifact; this does not prove current production errors."
          }
      - name: Restore frozen geographic and live-price input backups
        run: |
          mkdir -p "${RUNNER_TEMP}/apt-audit-inputs"
          gzip -t docs/transport-inputs/apt-live.js.gz
          gzip -t docs/transport-inputs/apt-geo.js.gz
          gzip -dc docs/transport-inputs/apt-live.js.gz > "${RUNNER_TEMP}/apt-audit-inputs/apt-live.js"
          gzip -dc docs/transport-inputs/apt-geo.js.gz > "${RUNNER_TEMP}/apt-audit-inputs/apt-geo.js"
          echo "Restored frozen input files; these are NOT the live database."
      - name: Audit latest master in temporary worktree against isolated baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git worktree add --detach "${RUNNER_TEMP}/aptmap-master" FETCH_HEAD
          cp scripts/audit-apt-ranks.mjs "${RUNNER_TEMP}/aptmap-master/scripts/audit-apt-ranks.mjs"
          cp scripts/transport-runtime.mjs "${RUNNER_TEMP}/aptmap-master/scripts/transport-runtime.mjs"
          set +e
          TRANSPORT_INPUTS="${RUNNER_TEMP}/apt-audit-inputs" node "${RUNNER_TEMP}/aptmap-master/scripts/audit-apt-ranks.mjs" \
            --root "${RUNNER_TEMP}/aptmap-master" --baseline-root "$GITHUB_WORKSPACE" \
            --out /tmp/apt-live-audit.json > /tmp/apt-live-summary.json
          status=$?
          set -e
          node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync("/tmp/apt-live-audit.json","utf8"));
            console.log("AUDIT_STATUS",x.status,"BASELINE",x.baselineRoot,"SOURCE",x.root);
            for(const b of x.bands){
              const codes={};
              for(const f of b.findings||[])codes[f.code]=(codes[f.code]||0)+1;
              console.log("BAND",JSON.stringify({cap:b.cap,status:b.status,rows:b.rows||0,
                errors:b.counts?.error||0,review:b.counts?.review||0,reason:b.reason||null,codes,
                firstFindings:(b.findings||[]).slice(0,5)}));
            }
          '
          exit "$status"
      - name: Cross-check dated government redevelopment evidence against all price bands
        if: always()
        run: |
          set -euo pipefail
          test -d "${RUNNER_TEMP}/aptmap-master"
          cp scripts/audit-apt-project-facts.mjs "${RUNNER_TEMP}/aptmap-master/scripts/audit-apt-project-facts.mjs"
          TRANSPORT_INPUTS="${RUNNER_TEMP}/apt-audit-inputs" node "${RUNNER_TEMP}/aptmap-master/scripts/audit-apt-project-facts.mjs" \
            --root "${RUNNER_TEMP}/aptmap-master" \
            --evidence "$GITHUB_WORKSPACE/docs/audit-redevelopment-registry.json" \
            --out /tmp/apt-project-facts.json > /tmp/apt-project-facts-stdout.json
          node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync("/tmp/apt-project-facts.json","utf8"));
            for(const p of x.projects){
              console.log("PROJECT",JSON.stringify({id:p.project_id,status:p.status,
                members:p.members,observations:p.observations,issues:p.issues}));
            }
          '
      - name: Upload separate read-only audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apt-rank-read-only-audit
          path: |
            /tmp/apt-policy-audit.json
            /tmp/apt-snapshot-audit.json
            /tmp/apt-live-audit.json
            /tmp/apt-project-facts.json
          if-no-files-found: warn
          retention-days: 14

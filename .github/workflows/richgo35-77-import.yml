name: One-time Richgo 30-plus 77-unit audit import
on:
  push:
    branches:
      - audit/richgo-30plus-top300-20261118
    paths:
      - .github/workflows/richgo35-77-import.yml
permissions:
  contents: write
jobs:
  import-verified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 30+ audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve verified 30+ files from sandbox
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sb-y2sgh6alo49l.vercel.run"
          for FILE in \
            docs/richgo-over30-current-top300-20261118.csv \
            docs/richgo-over30-top300-report-20261118.md \
            public/apt-r35.js \
            scripts/test-richgo35-top300.cjs
          do
            curl --fail --show-error --silent --location --retry 5 --retry-delay 2 "$BASE/$FILE" --output "$FILE"
            test -s "$FILE"
            echo "Downloaded $FILE"
          done
      - name: Validate 300 source rows, corrections, and price-band isolation
        run: |
          node scripts/test-richgo35-top300.cjs
          git diff --check
      - name: Commit changes exclusively to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/richgo-over30-current-top300-20261118.csv
          git add docs/richgo-over30-top300-report-20261118.md public/apt-r35.js scripts/test-richgo35-top300.cjs
          git diff --cached --stat
          if git diff --cached --quiet; then exit 1; fi
          git commit -m 'Reconcile remaining 77 top-300 Richgo complexes with verified source data'
          git push origin HEAD:refs/heads/audit/richgo-30plus-top300-20261118

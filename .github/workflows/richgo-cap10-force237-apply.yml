name: Apply Richgo public truth to 237 previously unresolved apartments
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-force237-apply.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six complete public Richgo catalog shards
        run: |
          node --check scripts/apply-richgo-cap10-force237-final.cjs
          for s in 0 1 2 3 4 5; do
            test -s docs/richgo-6to10-force237-catalog-parts/part0${s}.json
          done
      - name: Replace source data for all identified Richgo apartment entities
        run: node scripts/apply-richgo-cap10-force237-final.cjs
      - name: Confirm only cap10 data corrections and integrity
        run: |
          git fetch origin audit/richgo-6to10-top300-20261118
          git checkout -f FETCH_HEAD
          node scripts/test-richgo-cap10-final.cjs
          node scripts/test-richgo-6to10-crossband.cjs
          node scripts/test-richgo-band10-audit.cjs
      - name: Verify full app build without expanding original gzip budget
        run: |
          npm ci --ignore-scripts
          npm run build

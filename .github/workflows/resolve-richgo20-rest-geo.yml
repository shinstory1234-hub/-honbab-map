name: Geo verify unresolved Richgo 15-20b apartments
on:
  push:
    branches: [audit/richgo-15to20-top300-20261118]
    paths: [scripts/resolve-richgo20-rest-geo.cjs, .github/workflows/resolve-richgo20-rest-geo.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node scripts/resolve-richgo20-rest-geo.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/richgo20-rest-geo-20261118.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: corroborate Richgo apartment matches against geographic coordinates"
            git push origin HEAD:audit/richgo-15to20-top300-20261118
          fi

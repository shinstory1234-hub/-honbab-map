name: Richgo 1114 independent source and entity revalidation
on:
  push:
    branches:
      - audit/richgo-10to15-top300-20261118
    paths:
      - .github/workflows/richgo15-revalidate-all1114.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-fetch each Richgo public page and check all 1114 source rows
        run: node scripts/richgo15-revalidate-all1114.cjs
      - name: Commit independent fact comparison and suspicious entity report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/richgo-10to15-revalidate1114-source.json docs/richgo-10to15-revalidate1114-risk.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: independent second-pass Richgo page evidence and wrong-entity risk assessment [skip ci]"
            git pull --rebase origin audit/richgo-10to15-top300-20261118
            git push origin HEAD:audit/richgo-10to15-top300-20261118
          fi

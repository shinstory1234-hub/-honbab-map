name: Merge cap10 final343 verified facts and enforce speed ceiling
on:
  push:
    branches:
      - audit/richgo-6to10-top300-20261118
    paths:
      - .github/workflows/richgo-cap10-final343-merge.yml
      - scripts/merge-richgo-cap10-final343.cjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: richgo-cap10-final343-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/richgo-6to10-top300-20261118
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for all six source shards
        run: |
          for attempt in $(seq 1 90); do
            READY=1
            for x in 0 1 2 3 4 5; do
              if [ ! -f "docs/richgo-6to10-final343-parts/part0${x}.json" ]; then READY=0; fi
            done
            if [ "$READY" -eq 1 ]; then exit 0; fi
            git fetch origin audit/richgo-6to10-top300-20261118
            git checkout -f FETCH_HEAD
            sleep 10
          done
          echo 'Missing one or more source shards'; exit 1
      - name: Verify syntax and publish verified cap10 corrections
        run: |
          node --check scripts/merge-richgo-cap10-final343.cjs
          node scripts/merge-richgo-cap10-final343.cjs
      - name: Refresh source and verify data integrity
        run: |
          git fetch origin audit/richgo-6to10-top300-20261118
          git checkout -f FETCH_HEAD
          node scripts/test-richgo-cap10-final.cjs
          node scripts/test-richgo-6to10-crossband.cjs
          node scripts/test-richgo-band10-audit.cjs
      - name: Verify original network performance ceiling
        run: |
          npm ci --ignore-scripts
          npm run build

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>저평가지도</title>
<link rel="preconnect" href="https://honbab-map.vercel.app">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f6f5f2}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="m" title="저평가지도" allow="geolocation"></iframe>
<script>
/* 이용 전 동의는 이 바깥 페이지(같은 도메인 저장소)에 기억하고 iframe에 ?ok=1로 넘김 — 다른 도메인 iframe 저장소가 막힌 브라우저에서도 다시 안 뜨게(2026.11.2) */
(function(){ var K='apt6_notice_v1', ok=false; try{ ok=localStorage.getItem(K)==='yes'; }catch(e){}
  var q=new URLSearchParams(location.search); if(ok) q.set('ok','1');
  document.getElementById('m').src='https://honbab-map.vercel.app/apt-map.html'+(q.toString()?'?'+q.toString():'')+location.hash;
  window.addEventListener('message',function(e){ if(e.origin==='https://honbab-map.vercel.app'&&e.data&&e.data.apt6notice==='yes'){ try{ localStorage.setItem(K,'yes'); }catch(err){} } });
})();
</script>
</body>
</html>

<title>6억 이하 특이점 단지 지도</title>

<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--fg:#17171a;--muted:#6b6b73;--line:#e6e4df;

  --c2:#2f6fde; /* 천지개벽 */
  --c3:#1f9d6b; /* 하방경직 */
  --c4:#8a4fd8; /* 정비대기열 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.handle{display:none}
header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;color:var(--fg)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed=false]{opacity:.38}
main{flex:1;display:flex;min-height:0}
#map{flex:1;min-height:300px}
aside{width:380px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
#list{overflow:auto;flex:1}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.on{background:#faf8f4}
.item .top{display:flex;align-items:baseline;gap:8px}
.item .nm{font-weight:650;font-size:14px}
.item .pr{margin-left:auto;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta{font-size:12px;color:var(--muted);margin-top:3px}
.tag{font-size:10.5px;font-weight:600;color:#fff;border-radius:4px;padding:2px 6px;white-space:nowrap}
.detail{display:none;margin-top:8px;font-size:12.5px;line-height:1.55}
.item.on .detail{display:block}
.detail b{font-weight:650}
.detail .risk{color:#9a3b2a;margin-top:4px}
.detail .reg{margin-top:4px;color:var(--muted)}
.ov{background:#fff;border:2px solid;border-radius:8px;padding:3px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:translateY(-34px);cursor:pointer;font-family:Pretendard,sans-serif}
.ov small{font-weight:500;color:#555;margin-left:4px}
.ov.on{z-index:10;transform:translateY(-34px) scale(1.08)}
.note{padding:10px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
#keymsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:var(--bg);z-index:5;text-align:center;font-size:14px;line-height:1.7;padding:20px}
.mapwrap{flex:1;position:relative;display:flex}
@media (max-width:800px){
  header{padding:10px 12px 8px;gap:6px;flex-wrap:nowrap;flex-direction:column;align-items:stretch}
  header h1{font-size:15px}
  header .sub{font-size:11px}
  .chips{margin-left:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 10px}
  main{flex-direction:column;min-height:0}
  .mapwrap{flex:1;min-height:0}
  aside{width:100%;height:36dvh;flex:none;border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 14px rgba(0,0,0,.08);transition:height .2s}
  body.sheet-open aside{height:74dvh}
  #map{min-height:0}
  .handle{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;border:none;background:none;padding:8px 0 2px;font:inherit;font-size:12px;color:var(--muted);flex:none}
  .handle::before{content:"";width:36px;height:4px;border-radius:2px;background:#d6d3cc}
  .search{padding:6px 12px 8px}
  .search input{font-size:16px}
  .note{display:none}
  .item{padding:11px 14px}
}
</style>

];

/* ============ 앱 ============ */
const state = {on:new Set(Object.keys(CATS)), q:'', sel:null};
const $ = s => document.querySelector(s);
const key = KAKAO_JS_KEY || new URLSearchParams(location.search).get('key');
if(!key){
  const m=$('#keymsg'); m.style.display='flex';
  m.innerHTML='카카오 JavaScript 키가 필요해.<br>파일 상단 <b>KAKAO_JS_KEY</b>에 넣거나 주소 뒤에 <b>?key=키</b>를 붙여줘.<br><span style="color:#888;font-size:12px">카카오 개발자콘솔에 이 페이지 도메인 등록도 필요</span>';
}

function renderChips(){
  const host=$('#chips'); host.innerHTML='';
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement('button'); b.className='chip'; b.title=v.desc;
    b.setAttribute('aria-pressed', state.on.has(k));
    b.innerHTML=`<i style="background:${v.hex}"></i>${k} <span style="color:#999">${D.filter(d=>d.cat.includes(k)).length}</span>`;
    b.onclick=()=>{ state.on.has(k)?state.on.delete(k):state.on.add(k); render(); };
    host.append(b);
  });
}
const visible = d => d.cat.some(c=>state.on.has(c)) && (!state.q || (d.n+d.area).includes(state.q));

let map, overlays=[];
function renderList(){
  const host=$('#list'); host.innerHTML='';
  D.forEach((d,i)=>{
    if(!visible(d)) return;
    const el=document.createElement('div'); el.className='item'+(state.sel===i?' on':''); el.id='it'+i;
    const tags=d.cat.map(c=>`<span class="tag" style="background:${CATS[c].hex}">${c}</span>`).join(' ');
    el.innerHTML=`<div class="top"><span class="nm"></span><span class="pr"></span></div>
      <div class="meta"></div><div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">${tags}</div>
      <div class="detail"><div class="why"></div><div class="deal" style="margin-top:4px"></div><div class="risk"></div><div class="reg"></div></div>`;
    el.querySelector('.nm').textContent=d.n;
    el.querySelector('.pr').textContent=d.price;
    el.querySelector('.meta').textContent=`${d.area} · ${d.spec}`;
    el.querySelector('.why').textContent=d.why;
    el.querySelector('.deal').textContent=d.deal||'';
    el.querySelector('.risk').textContent=d.risk&&d.risk!=='—'?'⚠ '+d.risk:'';
    el.querySelector('.reg').textContent='규제: '+d.reg;
    el.onclick=()=>select(i,true);
    host.append(el);
  });
}
function select(i,pan){
  state.sel=i; renderList();
  overlays.forEach(o=>o.el.classList.toggle('on',o.i===i));
  const d=D[i];
  if(pan && map && d._pos){
    if(mobile()) setSheet(false);
    map.setLevel(Math.min(map.getLevel(),6)); map.panTo(d._pos);
  }
  const it=document.getElementById('it'+i); if(it) it.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function renderMap(){
  if(!map) return;
  overlays.forEach(o=>{const v=visible(D[o.i])?map:null; o.ov.setMap(v); o.dot.setMap(v);});
}
function render(){ renderChips(); renderList(); renderMap(); }
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim(); render();});
const mobile=()=>window.matchMedia('(max-width:800px)').matches;
function setSheet(open){
  document.body.classList.toggle('sheet-open',open);
  $('#handle').textContent=open?'목록 접기':'목록 펼치기';
  setTimeout(()=>{ if(map){ const c=map.getCenter(); map.relayout(); map.setCenter(c);} },230);
}
$('#handle').addEventListener('click',()=>setSheet(!document.body.classList.contains('sheet-open')));
window.addEventListener('resize',()=>{ if(map) map.relayout(); });
render();

function addOverlay(i){
  const d=D[i]; const c=CATS[d.cat[0]].hex;
  const el=document.createElement('div'); el.className='ov'; el.style.borderColor=c; el.style.color=c;
  el.innerHTML='<span></span><small></small>';
  el.firstChild.textContent=d.price; el.lastChild.textContent=d.n.replace(/\s*\(.*\)/,'').slice(0,10);
  el.onclick=()=>{ select(i,false); };
  const ov=new kakao.maps.CustomOverlay({position:d._pos, content:el, yAnchor:0, zIndex:3});
  const dot=new kakao.maps.Circle({center:d._pos,radius:60,strokeWeight:2,strokeColor:c,strokeOpacity:1,fillColor:c,fillOpacity:.6});
  dot.setMap(visible(d)?map:null);
  overlays.push({i,ov,el,dot});
  ov.setMap(visible(d)?map:null);
}

if(key){
  const s=document.createElement('script');
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
  s.onerror=()=>{const m=$('#keymsg');m.style.display='flex';m.textContent='카카오 SDK 로드 실패. 키 또는 도메인 등록을 확인해줘.';};
  s.onload=()=>kakao.maps.load(init);
  document.head.append(s);
}

function init(){
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(37.52,126.95),level:9});
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  const places=new kakao.maps.services.Places();
  const bounds=new kakao.maps.LatLngBounds();
  let pending=0;
  const done=()=>{ if(--pending===0 && !bounds.isEmpty()) map.setBounds(bounds); };
  D.forEach((d,i)=>{
    pending++;
    if(d.lat){ d._pos=new kakao.maps.LatLng(d.lat,d.lng); bounds.extend(d._pos); addOverlay(i); done(); return; }
    places.keywordSearch(d.q||d.n,(res,status)=>{
      if(status===kakao.maps.services.Status.OK){
        d._pos=new kakao.maps.LatLng(+res[0].y,+res[0].x); bounds.extend(d._pos); addOverlay(i);
      } else console.warn('위치 못 찾음:',d.n);
      done();
    });
  });
  // 확대 수준에 따라 라벨 숨김(멀리선 점만)
  kakao.maps.event.addListener(map,'zoom_changed',()=>{
    const far=map.getLevel()>9; overlays.forEach(o=>o.el.style.display=far?'none':'');
  });
}
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>6억 이하 특이점 단지 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--fg:#17171a;--muted:#6b6b73;--line:#ebe9e4;--soft:#f7f6f3;
  --c1:#e2553b;--c2:#2f6fde;--c3:#1f9d6b;--c4:#8a4fd8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--fg);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;z-index:5}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .15s}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed=false]{opacity:.35}

main{flex:1;display:flex;min-height:0;position:relative}
.mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0}
#keymsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.7;padding:24px;color:var(--muted);z-index:2;background:var(--bg)}

/* 사이드/시트 */
aside{width:400px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:6}
.sheet-head{flex:none}
.grab{display:none}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;background:var(--soft)}
.search input:focus{outline:2px solid #cfcac0;background:#fff}
.body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* 목록 */
.item{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:active{background:var(--soft)}
.item .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.item .main{flex:1;min-width:0}
.item .top{display:flex;gap:8px;align-items:baseline}
.item .nm{font-weight:650;font-size:15px;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{margin-left:auto;font-weight:750;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.item .hook{font-size:13px;margin-top:5px;color:#33333a;line-height:1.45}

/* 상세 카드 */
.detail{padding:6px 16px 28px}
.back{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);padding:8px 0}
.d-title{font-size:20px;font-weight:750;letter-spacing:-.4px;margin-top:2px}
.d-area{font-size:13px;color:var(--muted);margin-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:650;color:#fff;border-radius:5px;padding:3px 7px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--soft);border-radius:10px;padding:9px 10px}
.kpi .v{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
.sec{margin-top:18px}
.sec h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec h3 i{width:4px;height:14px;border-radius:2px;display:inline-block}
.pts{list-style:none;display:flex;flex-direction:column;gap:8px}
.pts li{font-size:14px;line-height:1.55;padding-left:22px;position:relative}
.pts li b{font-weight:700}
.pts li::before{position:absolute;left:0;top:0;font-weight:700}
.pts.good li::before{content:"✓";color:var(--c3)}
.pts.bad li::before{content:"!";color:#c0432c;left:5px}
.pts.bad li{color:#5a3a33}
.reg{font-size:13px;background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.5}
.deal{font-size:12.5px;color:var(--muted);margin-top:10px}

/* 지도 라벨 */
.ov{background:#fff;border:2px solid;border-radius:9px;padding:3px 8px;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);transform:translate(-50%,-130%);cursor:pointer;font-family:Pretendard,sans-serif;position:relative}
.ov::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:inherit;border-bottom:0}
.ov small{font-weight:550;color:#555;margin-left:4px}
.ov.on{transform:translate(-50%,-130%) scale(1.12);z-index:10}
.ov.mini small{display:none}
.note{padding:10px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}

/* ===== 모바일: 드래그 바텀시트 ===== */
@media (max-width:800px){
  header{padding:10px 12px 9px;flex-direction:column;align-items:stretch;gap:7px}
  header h1{font-size:15.5px}
  header .sub{font-size:11px}
  header>*{min-width:0;max-width:100%}
  .chips{margin-left:0;overflow-x:auto;width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  aside{
    position:fixed;left:0;right:0;bottom:0;width:100%;
    height:calc(100dvh - 70px);
    border:none;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);
    transform:translateY(var(--y,60dvh));will-change:transform;
  }
  aside.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .sheet-head{touch-action:none;cursor:grab}
  .grab{display:flex;justify-content:center;padding:9px 0 3px}
  .grab span{width:40px;height:5px;border-radius:3px;background:#d4d0c8}
  .search{border-bottom:1px solid var(--line);padding:6px 12px 10px}
  .search input{font-size:16px}
  .note{display:none}
  .body{padding-bottom:env(safe-area-inset-bottom)}
}
</style>

  {n:'안양 종합운동장 동측 재개발', cat:['천지개벽','정비대기열'], area:'안양 동안 비산동', spec:'빌라·주택 지분', price:'지분',
   k:[['1,850','계획 세대'],['2028.4','착공 예정'],['2029','월판선']],
   hook:'래미안 하이스티지, 관리처분 전',
   pts:['<b>진도</b>: 사업시행인가(2026.5), 삼성물산 래미안 하이스티지 1,850세대, 착공 2028.4 예정','<b>교통</b>: 월판선 안양운동장역(2029)','<b>규제 틈새</b>: 재개발 빌라는 10·15 토허 실거주 미적용'],
   risks:['관리처분인가 전까지만 조합원 지위로 매수 가능','현재 지분 시세는 매물 확인 필요(2024 기사 3.5~5.7억)'], reg:'재개발 빌라 · 토허 실거주 미적용', deal:'', q:'안양종합운동장'}
];

/* ===== 상태/유틸 ===== */
const state={on:new Set(Object.keys(CATS)),q:'',sel:null};
const $=s=>document.querySelector(s);
const mobile=()=>matchMedia('(max-width:800px)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich=s=>esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
const visible=d=>d.cat.some(c=>state.on.has(c))&&(!state.q||(d.n+d.area+d.hook).includes(state.q));

/* ===== 칩 ===== */
function renderChips(){
  const h=$('#chips');h.innerHTML='';
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement('button');b.className='chip';b.title=v.desc;b.setAttribute('aria-pressed',state.on.has(k));
    b.innerHTML=`<i style="background:${v.hex}"></i>${k} <span style="color:#999">${D.filter(d=>d.cat.includes(k)).length}</span>`;
    b.onclick=()=>{state.on.has(k)?state.on.delete(k):state.on.add(k);state.sel=null;render();};
    h.append(b);
  });
}

/* ===== 목록 / 상세 ===== */
function renderBody(){
  const b=$('#body');
  if(state.sel!==null){
    const d=D[state.sel];
    b.innerHTML=`<div class="detail">
      <button class="back" id="back">‹ 목록</button>
      <div class="d-title">${esc(d.n)}</div>
      <div class="d-area">${esc(d.area)} · ${esc(d.spec)}</div>
      <div class="tags">${d.cat.map(c=>`<span class="tag" style="background:${CATS[c].hex}">${c}</span>`).join('')}</div>
      <div class="kpis">${d.k.map(([v,l])=>`<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('')}</div>
      <div class="sec"><h3><i style="background:var(--c3)"></i>투자 포인트</h3><ul class="pts good">${d.pts.map(p=>`<li>${rich(p)}</li>`).join('')}</ul></div>
      <div class="sec"><h3><i style="background:#c0432c"></i>리스크·확인할 것</h3><ul class="pts bad">${d.risks.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
      <div class="sec"><h3><i style="background:#999"></i>규제·대출</h3><div class="reg">${esc(d.reg)}</div>${d.deal?`<div class="deal">${esc(d.deal)}</div>`:''}</div>
    </div>`;
    $('#back').onclick=()=>{state.sel=null;render();};
    b.scrollTop=0;return;
  }
  b.innerHTML='';
  D.forEach((d,i)=>{
    if(!visible(d))return;
    const el=document.createElement('div');el.className='item';
    el.innerHTML=`<span class="dot" style="background:${CATS[d.cat[0]].hex}"></span><div class="main">
      <div class="top"><span class="nm">${esc(d.n)}</span><span class="pr">${esc(d.price)}</span></div>
      <div class="meta">${esc(d.area)} · ${esc(d.spec)}</div><div class="hook">${esc(d.hook)}</div></div>`;
    el.onclick=()=>select(i,true);
    b.append(el);
  });
}

/* ===== 지도 ===== */
let map,overlays=[];
function renderMap(){
  overlays.forEach(o=>{const v=visible(D[o.i])?map:null;o.ov.setMap(v);o.el.classList.toggle('on',o.i===state.sel);});
}
function render(){renderChips();renderBody();if(map)renderMap();}
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();state.sel=null;render();});

function select(i,pan){
  state.sel=i;render();
  const d=D[i];
  if(mobile()) snapTo('half');
  if(map&&d._pos){
    if(map.getLevel()>6) map.setLevel(6);
    // 모바일: 시트에 가리지 않게 화면 위쪽으로 오프셋
    if(mobile()){
      const proj=map.getProjection(),pt=proj.containerPointFromCoords(d._pos);
      const h=$('#map').clientHeight, target=new kakao.maps.Point(pt.x, pt.y + h*0.22);
      map.panTo(proj.coordsFromContainerPoint(target));
    } else map.panTo(d._pos);
  }
}

function addOverlay(i){
  const d=D[i],c=CATS[d.cat[0]].hex;
  const el=document.createElement('div');el.className='ov';el.style.borderColor=c;el.style.color=c;
  el.innerHTML=`<span>${esc(d.price)}</span><small>${esc(d.n.replace(/\s*\(.*\)/,'').slice(0,9))}</small>`;
  el.addEventListener('click',e=>{e.stopPropagation();select(i,false);});
  const ov=new kakao.maps.CustomOverlay({position:d._pos,content:el,yAnchor:0,xAnchor:0,zIndex:3,clickable:true});
  overlays.push({i,ov,el});ov.setMap(visible(d)?map:null);
}

/* ===== 바텀시트 드래그 (모바일) ===== */
const sheet=$('#sheet');
let snaps={},cur='peek',y=0;
function calcSnaps(){
  sheet.style.height=(innerHeight-document.querySelector('header').offsetHeight-6)+'px';
  const H=sheet.offsetHeight;
  snaps={full:0, half:Math.round(H*0.45), peek:H-150};
}
function setY(v,anim){
  y=Math.max(0,Math.min(snaps.peek,v));
  sheet.classList.toggle('anim',!!anim);
  sheet.style.setProperty('--y',y+'px');
}
function snapTo(name){ if(!mobile())return; calcSnaps(); cur=name; setY(snaps[name],true); }
(function initSheet(){
  if(!mobile())return;
  calcSnaps(); setY(snaps.peek,false);
  let startY=0,startPos=0,lastY=0,lastT=0,vel=0,dragging=false,fromBody=false;
  const body=$('#body');
  const down=(e,fb)=>{
    const t=e.touches?e.touches[0]:e;
    dragging=true;fromBody=fb;startY=lastY=t.clientY;startPos=y;lastT=performance.now();vel=0;
    sheet.classList.remove('anim');
  };
  const move=e=>{
    if(!dragging)return;
    const t=e.touches?e.touches[0]:e, dy=t.clientY-startY;
    // 목록 스크롤 중이면: 맨 위에서 아래로 끌 때만 시트를 내림
    if(fromBody){
      if(y<=0 && (body.scrollTop>0 || dy<0)){ startY=t.clientY; return; }
      if(e.cancelable) e.preventDefault();
    }
    const now=performance.now(); vel=(t.clientY-lastY)/Math.max(1,now-lastT); lastY=t.clientY; lastT=now;
    setY(startPos+dy,false);
  };
  const up=()=>{
    if(!dragging)return; dragging=false;
    const order=['full','half','peek'];
    let target;
    if(Math.abs(vel)>0.45){ // 빠르게 튕기면 방향대로 한 단계
      const idx=order.indexOf(nearest());
      target=order[Math.max(0,Math.min(2, idx+(vel>0?1:-1)))];
      if(vel>0&&y>snaps.half) target='peek';
      if(vel<0&&y<snaps.half) target='full';
    } else target=nearest();
    snapTo(target);
  };
  const nearest=()=>Object.entries(snaps).sort((a,b)=>Math.abs(a[1]-y)-Math.abs(b[1]-y))[0][0];
  const head=$('#head');
  head.addEventListener('touchstart',e=>down(e,false),{passive:true});
  body.addEventListener('touchstart',e=>{ if(y>0||body.scrollTop<=0) down(e,true); },{passive:true});
  body.addEventListener('touchmove',e=>{ if(dragging && (y>0 || fromBody)) move(e); },{passive:false});
  head.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',up);
  // 시트가 덜 올라와 있을 땐 목록 자체 스크롤 막고 시트를 올림
  body.addEventListener('scroll',()=>{ if(y>0) body.scrollTop=0; });
  $('#q').addEventListener('focus',()=>snapTo('full'));
  head.addEventListener('click',e=>{ if(e.target.tagName!=='INPUT' && Math.abs(lastY-startY)<4) snapTo(cur==='peek'?'half':cur==='half'?'full':'peek'); });
  addEventListener('resize',()=>{calcSnaps();setY(snaps[cur],false);});
})();

render();

/* ===== 카카오 로드 ===== */
(function(){
  const s=document.createElement('script');
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
  s.onerror=()=>{const m=$('#keymsg');m.style.display='flex';m.innerHTML='지도를 불러오지 못했어.<br><span style="font-size:12px">카카오 개발자콘솔 &gt; 플랫폼 &gt; Web에 이 주소가 등록돼 있는지 확인</span>';};
  s.onload=()=>kakao.maps.load(init);
  document.head.append(s);
})();
function init(){
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(37.5,126.95),level:9});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  kakao.maps.event.addListener(map,'click',()=>{ if(mobile()) snapTo('peek'); });
  const places=new kakao.maps.services.Places(),bounds=new kakao.maps.LatLngBounds();
  let pending=D.length;
  const done=()=>{ if(--pending===0&&!bounds.isEmpty()) map.setBounds(bounds,40,40,mobile()?160:40,40); };
  D.forEach((d,i)=>{
    if(d.lat){d._pos=new kakao.maps.LatLng(d.lat,d.lng);bounds.extend(d._pos);addOverlay(i);done();return;}
    places.keywordSearch(d.q||d.n,(res,st)=>{
      if(st===kakao.maps.services.Status.OK){d._pos=new kakao.maps.LatLng(+res[0].y,+res[0].x);bounds.extend(d._pos);addOverlay(i);}
      done();
    });
  });
  const lab=()=>{const far=map.getLevel()>8;overlays.forEach(o=>o.el.classList.toggle('mini',far));};
  kakao.maps.event.addListener(map,'zoom_changed',lab);
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>6억지도 · 6억 안에서 지금 오를 단지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#fff;--bg-subtle:rgb(247,247,248);--bg-muted:rgb(244,244,245);
  --border:rgba(112,115,124,.22);--border-soft:rgba(112,115,124,.14);
  --text:#171719;--text-secondary:rgb(55,56,60);--text-tertiary:rgba(112,115,124,.95);--text-faint:rgba(112,115,124,.7);
  --primary:#0066ff;--primary-hover:rgb(0,94,235);--primary-soft-bg:rgb(234,242,254);--primary-soft-fg:#0055d1;
  --up:#ff4242;--warning-fg:#b26a00;--success:#00a35c;--track-off:rgba(112,115,124,.16);
  --shadow-card:0 1px 4px rgba(23,23,23,.06);--shadow-float:0 8px 24px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:rgb(23,23,25);--bg-subtle:rgb(27,28,30);--bg-muted:rgb(38,39,42);
  --border:rgba(255,255,255,.12);--border-soft:rgba(255,255,255,.08);
  --text:#fff;--text-secondary:rgba(255,255,255,.82);--text-tertiary:rgba(255,255,255,.62);--text-faint:rgba(255,255,255,.45);
  --primary-soft-bg:rgba(0,102,255,.16);--primary-soft-fg:#5a9dff;--up:#ff6b6b;--warning-fg:#ffb238;--success:#00d64c;--track-off:rgba(255,255,255,.14);
  --shadow-card:none;--shadow-float:0 8px 24px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}

/* ── masthead ── */
.masthead{display:flex;align-items:center;gap:24px;height:72px;padding:0 28px;border-bottom:1px solid var(--text);flex:none;z-index:21;background:var(--bg)}
.wordmark{display:inline-flex;align-items:baseline;font-size:31px;font-weight:950;line-height:1;letter-spacing:-.095em;white-space:nowrap}
.wordmark i{display:inline-block;width:7px;height:7px;margin-left:6px;background:var(--primary)}
.caption{font-size:12px;color:var(--text-tertiary);padding-left:20px;border-left:1px solid var(--border);white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;width:360px;max-width:100%;min-height:44px;border:1px solid var(--border);border-radius:4px;padding-left:14px;background:var(--bg-subtle);margin-left:auto}
.search svg{flex:none;color:var(--text-tertiary)}
.search input{flex:1;min-width:0;font-size:15px;padding:8px 12px 8px 0;outline:none}
.search input::placeholder{color:var(--text-tertiary)}

main{flex:1;display:flex;min-height:0;position:relative}
.mapwrap{flex:1;position:relative;min-width:0;background:var(--bg-subtle)}
#map{position:absolute;inset:0}
#keymsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.7;padding:24px;color:var(--text-tertiary);z-index:2;background:var(--bg-subtle)}

/* ── panel ── */
aside{order:-1;width:408px;flex:none;border-right:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;min-height:0;z-index:20}
.grab{display:none}
.sheet-head{flex:none}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}

.intro{padding:24px 24px 18px}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--primary-soft-fg);font-size:11px;font-weight:750;letter-spacing:.055em}
.eyebrow i{width:26px;height:1px;background:var(--primary)}
.intro h1{font-size:25px;font-weight:800;letter-spacing:-.05em;line-height:1.3;margin:12px 0 8px;word-break:keep-all}
.intro p{font-size:13.5px;line-height:1.7;color:var(--text-secondary);word-break:keep-all}
.method{margin-top:14px;border-top:1px solid var(--border-soft);font-size:13px;color:var(--text-secondary)}
.method summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;min-height:44px;list-style:none;font-weight:600}
.method summary::-webkit-details-marker{display:none}
.method summary svg{transition:transform .2s}
.method[open] summary svg{transform:rotate(180deg)}
.method dl>div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border-soft);line-height:1.6}
.method dt{font-weight:650;color:var(--text)}
.method dt small{display:block;font-weight:500;color:var(--text-tertiary);font-size:11.5px}
.method dd{color:var(--text-secondary);word-break:keep-all}

.filters{display:flex;gap:6px;overflow-x:auto;padding:0 24px 14px;scrollbar-width:none;border-bottom:1px solid var(--text)}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:36px;padding:6px 12px;font-size:12.5px;border:1px solid var(--border);border-radius:3px;color:var(--text-secondary);background:var(--bg);white-space:nowrap}
.filters.pb{border-bottom:0;padding-bottom:8px}
.filters button[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:650}
.count{display:flex;justify-content:space-between;padding:12px 24px;font-size:12px;color:var(--text-tertiary);border-bottom:1px solid var(--border-soft)}

.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .15s}
.row:hover{background:var(--bg-subtle)}
.row .rk{font-size:12px;color:var(--text-faint);padding-top:3px}
.kicker{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px;border-radius:3px;font-size:11.5px;font-weight:650;color:var(--text);background:color-mix(in srgb,var(--chip) 14%,transparent);flex:none}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--chip)}
.row h3{font-size:16.5px;font-weight:700;letter-spacing:-.035em;line-height:1.4;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row p{font-size:13px;line-height:1.6;color:var(--text-secondary);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.row .px{text-align:right;padding-top:22px}
.row .px strong{display:block;font-size:19px;font-weight:750;letter-spacing:-.035em;white-space:nowrap}
.row .px span{display:block;font-size:11.5px;color:var(--text-tertiary);margin-top:2px;white-space:nowrap}
.row .px b{display:block;font-size:12px;font-weight:700;color:var(--primary-soft-fg);margin-top:6px}

.excluded{padding:26px 24px 8px}
.excluded h2,.sec h3{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:16px;font-weight:700;letter-spacing:-.03em;padding-bottom:10px;border-bottom:2px solid var(--text)}
.excluded h2 small,.sec h3 small{font-size:12px;font-weight:500;color:var(--text-tertiary)}
.excluded li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;list-style:none}
.excluded li b{font-weight:700;color:var(--up);font-size:13px}
.excluded li span{grid-column:1/-1;font-size:12px;color:var(--text-tertiary)}
.source{padding:16px 24px 40px;font-size:11.5px;line-height:1.8;color:var(--text-tertiary);word-break:keep-all}

/* ── detail ── */
.phead{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:3px 14px 3px 16px;border-bottom:1px solid var(--border-soft)}
.phead button{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:600;color:var(--text-secondary)}
.phead button:hover{background:var(--bg-muted)}
.phead span{font-size:12.5px;color:var(--text-tertiary)}
.identity{padding:22px 24px 4px}
.identity .cat{font-size:13px;font-weight:600;color:var(--primary-soft-fg)}
.identity h2{font-size:25px;font-weight:750;letter-spacing:-.045em;line-height:1.35;margin:6px 0 6px;word-break:keep-all}
.identity .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--text-tertiary)}
.lede{margin:18px 24px 0;padding:16px 18px;background:var(--bg-subtle);border-left:2px solid var(--primary)}
.lede strong{display:block;font-size:17.5px;font-weight:750;letter-spacing:-.04em;line-height:1.45;word-break:keep-all}
.lede p.why{margin-top:8px;font-size:13px;color:var(--text-secondary)}
.lede p.why b{font-weight:650;color:var(--text);margin-right:4px}
.lede p{font-size:13.5px;line-height:1.8;color:var(--text-secondary);margin-top:8px;word-break:keep-all;white-space:pre-line}
.detail-tech-hidden{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;margin:20px 24px 0;border-top:2px solid var(--text);border-bottom:1px solid var(--border)}
.kpis>div{padding:13px 0 13px;min-width:0}
.kpis>div:nth-child(2n){padding-left:16px;border-left:1px solid var(--border-soft)}
.kpis>div:nth-child(n+3){border-top:1px solid var(--border-soft)}
.kpis dt{font-size:12px;color:var(--text-tertiary)}
.kpis dd{font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1.3;margin-top:3px;white-space:nowrap}
.kpis dd i{font-style:normal;font-size:13px;font-weight:600;color:var(--text-tertiary);margin-left:2px;letter-spacing:0}
.kpis dd.hl{color:var(--primary-soft-fg)}
.kpis small{display:block;font-size:11px;color:var(--text-faint);margin-top:2px;line-height:1.5}

.sec{margin:0 24px;padding:28px 0 0}
.score{display:flex;flex-direction:column}
.score>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.score .l{font-size:14px;font-weight:650}
.score .l small{display:block;font-size:12.5px;font-weight:400;color:var(--text-secondary);margin-top:2px;line-height:1.55;word-break:keep-all}
.score .v{font-size:14px;font-weight:750;white-space:nowrap}
.score .v i{font-style:normal;font-weight:500;color:var(--text-faint)}
.score .t{grid-column:1/-1;height:5px;border-radius:3px;background:var(--track-off);overflow:hidden}
.score .t b{display:block;height:100%;background:var(--primary);border-radius:3px}
.score .total{border-bottom:0;padding-top:14px}
.score .total .l{font-size:15px}
.score .total .v{font-size:22px;color:var(--primary-soft-fg)}

.cmp>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.cmp .n{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .v{font-weight:700}
.cmp .t{grid-column:1/-1;height:8px;border-radius:2px;background:var(--track-off);overflow:hidden}
.cmp .t b{display:block;height:100%;background:var(--text-faint)}
.cmp .me .n{color:var(--text);font-weight:700}
.cmp .me .t b{background:var(--primary)}
.cmp .me .v{color:var(--primary-soft-fg)}
.ldg{border-top:1px solid var(--border-soft)}
.ldg>div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 8px;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;align-items:baseline}
.ldg .s{font-weight:700;color:var(--text-tertiary);text-align:center}
.ldg .s.p{color:#00a35c}.ldg .s.m{color:#e5484d}
.ldg .l{font-weight:600;color:var(--text)}
.ldg .l small{display:block;font-weight:400;font-size:12px;color:var(--text-tertiary);line-height:1.6;margin-top:2px;word-break:keep-all}
.ldg .v{font-weight:700;white-space:nowrap}
.ldg .tot{background:var(--surface-2,rgba(0,102,255,.05))}
.ldg .tot .v{color:var(--primary-soft-fg)}
.note{font-size:12.5px;line-height:1.7;color:var(--text-tertiary);margin-top:10px;word-break:keep-all}

.stage{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border-soft)}
.stage li{position:relative;padding:12px 6px 10px 0;font-size:12.5px;color:var(--text-faint);line-height:1.4;word-break:keep-all}
.stage li::before{content:"";position:absolute;left:0;right:6px;top:-1px;height:3px;background:transparent}
.stage li span{display:block;font-size:11px;margin-bottom:3px}
.stage li.done{color:var(--text-secondary)}
.stage li.done::before{background:color-mix(in srgb,var(--primary) 40%,transparent)}
.stage li.now{color:var(--primary-soft-fg);font-weight:700}
.stage li.now::before{background:var(--primary)}
.inline-note{margin-top:12px;padding:12px 14px;background:var(--bg-subtle);border-left:2px solid var(--primary);font-size:13px;line-height:1.75;color:var(--text-secondary);word-break:keep-all}

.tl{list-style:none}
.tl li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;line-height:1.65;word-break:keep-all}
.tl time{font-size:12.5px;color:var(--text-tertiary);padding-top:1px}
.facts>div{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:14px;line-height:1.55}
.facts dt{color:var(--text-tertiary);flex:none}
.facts dt small{display:block;font-size:11.5px;color:var(--text-faint)}
.facts dd{text-align:right;font-weight:650;word-break:keep-all}
.facts .em dd{color:var(--primary-soft-fg);font-weight:750}
.fit{display:flex;flex-wrap:wrap;gap:6px}
.fit span{font-size:13px;padding:7px 12px;border:1px solid var(--border);border-radius:3px;color:var(--text-secondary)}
.checks{list-style:none;display:flex;flex-direction:column;gap:8px}
.checks li{padding:11px 14px;border-radius:4px;background:var(--bg-subtle);border-left:3px solid #c27c0e;font-size:13.5px;line-height:1.6;color:var(--text-secondary);word-break:keep-all}
.fine{margin:26px 24px 0;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;line-height:1.8;color:var(--text-tertiary);word-break:keep-all}
.pfoot{display:flex;gap:8px;padding:20px 24px 32px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;min-height:46px;padding:10px 16px;border-radius:4px;background:var(--primary);color:#fff;font-size:14px;font-weight:650}
.btn:hover{background:var(--primary-hover)}
.btn.ghost{flex:none;background:var(--bg);color:var(--text-secondary);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg-subtle)}

/* ── map markers (판단 chip) ── */
.mk{transform:translate(-50%,-100%) translateY(-6px);cursor:pointer;white-space:nowrap;font-family:"Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.02em;position:relative}
.mk>div{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(112,115,124,.28);border-radius:8px;box-shadow:0 2px 8px rgba(23,23,23,.12);padding:4px 8px 4px 4px;line-height:1.25}
.mk::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0;filter:drop-shadow(0 1px 0 rgba(112,115,124,.28))}
.mk .sc{display:grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:5px;background:var(--chip);color:#fff;font-size:11.5px;font-weight:750}
.mk b{font-size:12.5px;font-weight:750;color:#171719}
.mk small{display:block;font-size:10.5px;color:#70737c;font-weight:500;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.mk.far small{display:none}
.mk.sel>div{background:#171719;border-color:#171719}
.mk.sel::after{border-top-color:#171719}
.mk.sel b{color:#fff}.mk.sel small{color:rgba(255,255,255,.7)}
.mk:hover{z-index:5}
.mk.hide{display:none}
.mapcount{position:absolute;z-index:3;left:12px;top:12px;background:rgba(255,255,255,.94);border:1px solid rgba(112,115,124,.22);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;color:#46474c;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.06)}

@media (max-width:767px){
  .masthead{flex-wrap:wrap;height:auto;gap:8px 12px;padding:12px 16px}
  .wordmark{font-size:27px}
  .caption{padding-left:12px;font-size:11px}
  .search{order:3;width:100%;margin:0;min-height:42px}
  .search input{font-size:16px}
  aside{position:fixed;left:0;right:0;bottom:0;width:100%;border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.08);transform:translateY(var(--y,60dvh));will-change:transform}
  aside.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .sheet-head{touch-action:none}
  .grab{display:flex;justify-content:center;padding:9px 0 5px}
  .grab span{width:30px;height:3px;border-radius:3px;background:var(--border)}
  .intro{padding:10px 20px 14px}
  .intro h1{font-size:22px;margin-top:8px}
  .filters{padding:0 20px 12px}
  .count{padding:10px 20px}
  .row{padding:16px 20px}
  .excluded,.source{padding-left:20px;padding-right:20px}
  .identity{padding:16px 20px 2px}.identity h2{font-size:22px}
  .lede,.kpis{margin-left:20px;margin-right:20px}
  .kpis dd{font-size:21px}
  .sec{margin:0 20px}
  .fine{margin-left:20px;margin-right:20px}
  .pfoot{padding:18px 20px calc(24px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header class="masthead">
  <span class="wordmark">6억지도<i></i></span>
  <span class="caption">서울·경기·인천 · 2026.10.20 기준</span>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="단지명, 동네로 찾기" autocomplete="off"></label>
</header>
<main>
  <div class="mapwrap"><div id="mapcount" class="mapcount"></div><div id="map"></div><div id="keymsg"></div></div>
  <aside id="sheet">
    <div class="sheet-head" id="head"><div class="grab"><span></span></div></div>
    <div class="body" id="body"></div>
  </aside>
</main>

<script src="apt-picks.js"></script>
<script src="apt-auto3.js"></script>
<script src="apt-gj.js"></script>
<script src="apt-loc.js"></script>
<script src="apt-cx.js"></script>
<script src="apt-fard.js"></script>
<script src="apt-hak.js"></script>
<script src="apt-univ.js"></script>
<script src="apt-cur.js"></script>
<script src="apt-trn.js"></script>
<script src="apt-small.js"></script>
<script src="apt-s4q.js"></script>
<script src="apt-s4.js"></script>
<script src="apt-band.js"></script>
<script src="apt-plat.js"></script>
<script src="apt-geo.js"></script>
<script>
const KAKAO_JS_KEY='106bb734e8600621686fade2de7f8afb';
const $=s=>document.querySelector(s);
const mobile=()=>matchMedia('(max-width:767px)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eok=v=>{ if(v==null) return '—'; let e=Math.floor(v/10000), m=Math.round(v%10000/100)*100;
  if(m>=10000){e++;m=0;} return e? (m? `${e}억 ${m.toLocaleString()}` : `${e}억`) : `${m.toLocaleString()}만`; };
const eokH=v=>eok(v).replace(/(억|만)/g,'<i>$1</i>');
const short=v=>(Math.round(v/1000)/10)+'억';
const fmtM=m=>m==null?'':m>=1000?(m/1000).toFixed(1)+'km':Math.round(m)+'m';

      <div><dt>상승 여력<small>종합의 20%</small></dt><dd>· 일반 단지: 이 동네 신축 시세 × 같은 연식 할인 × 같은 평형 보정 = 받을 값. 현재가가 이보다 얼마나 싼가.<br>· 재건축: 내 몫 면적(용적률 증가 − 공공기여) → 34평까지 모자란 만큼 일반분양가로 사고 사업비를 내는 분담금(−) → 완공 시 시세(집값 상승·주변 일제 재건축 판도 프리미엄 +) → 연 5% 시간 할인과 공사 중 거주 손실(−) → 단계별 성공확률, 무산 시 기대감 하락(−). 공사비는 착공까지 연 3.5% 상승(−).<br>· 리모델링: 증축 40%, 일반분양 13.6%, 신축 대비 15% 할인.<br>· 장기전세·확정가 매수권: 지금 보증금 + 미래 확정가를 지금 돈으로 환산한 값이 실제 매수가.<br>신축 시세·연식 할인은 수도권 대단지 중 25년차 이하 578곳 회귀(설명력 96%).</dd></div>
      <div><dt>종합<small>순위</small></dt><dd>수도권 6억 이하 거래 단지 4,619곳(8,964개 평형) 안의 순위. 점수(0~100) = 세대수 백분위×0.4 + 입지 점수 백분위×0.4 + 상승 여력 백분위×0.2 — 세 백분위의 가중평균 그대로라 1위(약 95점)와 10위(약 91점), 100위(약 81점)의 실제 간격이 보임. 여력의 '적정가'는 26~33년차 연식 할인과 소형 평당 프리미엄을 같은 연식 실거래에 맞춰 보정(구축 소형이 체계적으로 싸 보이던 편향 제거). <b>세대수만 상승 요인으로 쓰는 이유</b>: 결과를 보기 전에 정한 규칙 — 2017→20·20→23·23→26 세 구간 모두 시·구 중위 대비 초과상승이 양(+)이거나, 두 구간이 양이면서 음인 구간의 손실이 양인 구간 평균의 절반 미만이고 재건축 단지를 빼도 유지될 것 — 을 통과한 유일한 요소. 학군·초품아·직주는 이 규칙을 통과하지 못해 순위에는 넣지 않고 적정가(가격 수준)와 배지·필터로만 반영. 이 비중으로 각 구간을 채점하면 상위−하위 20% 초과상승 차이는 17→20 +5.7%p, 20→23 −0.3%p, 23→26 +5.4%p. 입지는 순위 예측력이 거의 없지만(입지만 높은 소규모 단지가 위로 오는 걸 막으려면 세대수가 필요) 실거주 품질이라 세대수와 같은 비중으로 둔 판단. 세대수를 60%로 올리면 상승장 성과가 조금 더 좋지만 큰 단지 위주 순위가 됨. 여력 20%는 하락장 방어용으로 둔 <b>가정</b>. 비중 가정에 따라 순위가 흔들리므로 상세에 범위를 함께 표시. 이 순위는 '상승장에서 같은 동네보다 더 오를 가능성이 높은 순'으로 보는 게 정확함: 세대수 단독(상위−하위 20%)은 상승장 17→20 +5.4%p·23→26 +3.4%p였지만 하락장 20→23은 −3.8%p로 대단지가 오히려 덜 버팀. 하락장 방어는 여력(20%)이 일부 상쇄하는 정도(합산 20→23 −0.3%p). 모두 시·구 대비 성과라 동네 전체가 빠지면 1위도 같이 빠짐. 과거 데이터는 모델을 고르는 데 이미 썼기 때문에, 진짜 검증은 앞으로의 성적뿐 — 2026.10.23 순위 2,733곳을 그대로 고정 저장(<a href="apt-snap-2026-10-23.json">원본</a>)했고 2027.4·2027.10에 상위 20%와 하위 20%의 실제 초과상승을 여기 공개함. 입지 점수는 순수 위치만 — 주변 시세(상품 차이를 뺀 주변 단지 평당가) × 역 도보 × 평지, 모두 같은 동 안 실거래 회귀 계수.</dd></div>
      <div><dt>대상<small>범위</small></dt><dd>서울·경기·인천에서 최근 시세가 6억 이하인 평형이 있는 단지, 300세대 이상. 최근 시세 = 최근 3개월(7.22~10.21) 실거래 5건 이상이면 그 중위, 적으면 12개월 실거래를 시·구 월별 시세지수로 오늘 기준 환산한 중위(3개월 거래가 충분한 평형으로 검증하면 오차 중위 1.8%, 12개월 중위를 그대로 쓰면 3.0%·서울 6.1%). 재건축 대상이 아닌 전용 약 32.5㎡ 미만 평형은 순위에서 제외(백테스트상 37.5㎡ 미만 초소형은 세 구간 모두 열위였지만, 32.5~37.5㎡ 신축 소형까지 빼는 건 과하다고 보고 경계를 낮춤 — 판단). 용적률 350% 이상 고밀 단지 중 6억으로 살 수 있는 평형이 전용 50㎡ 이하뿐인 곳(당산대우·대우디오빌 같은 오피스텔형 — 저층 주공 소형 단지는 해당 없음)은 가족 실거주 아파트가 아니라서 대상에서 제외 — 데이터가 아니라 사이트 범위 정책(300세대 이상 소형 전용 단지의 백테스트는 −8.5·+5.5·−1.0%로 판정 불가). 같은 단지에 더 큰 6억 이하 평형이 있으면 그 평형으로 표시. 지역 단위로 빼지 않음 — 최근 하락 지역도 포함하고 상세 화면에 표시. ${D.filter(d=>!d.auto).length}곳 직접 분석, ${D.filter(d=>d.auto&&!d.u).length}곳 자동 선별, ${D.filter(d=>d.u).length.toLocaleString()}곳 전체 자동 수집. 자동 수집 단지의 시세·평형은 최근 12개월 국토부 실거래 중위.</dd></div>

const HILL_BADGE=30;                       // 역보다 30m 이상 높으면 '언덕 단지' 배지
const isHill=d=>!!(d.g&&d.g.dh!=null&&d.g.dh>=HILL_BADGE);
const isFlat=d=>!!(d.g&&d.g.dh!=null&&d.g.dh<15);

function hillGuard(S,top=50){                // S: 점수순 정렬된 배열. 반환: 표시 순서 배열
  const known=S.filter(d=>d.g&&d.g.dh!=null), base=known.filter(isHill).length/Math.max(1,known.length);
  const cap=Math.ceil(base*top), head=S.slice(0,top), hills=head.filter(isHill);
  if(hills.length<=cap) return S;
  const drop=new Set(hills.slice(cap));       // 순위 낮은 쪽부터 초과분
  const kept=head.filter(d=>!drop.has(d)), rest=S.slice(top);
  const fill=rest.filter(d=>!isHill(d)).slice(0,drop.size), fillSet=new Set(fill);
  return [...kept,...fill,...drop,...rest.filter(d=>!fillSet.has(d))];

    <div><dt>규제</dt><dd>${d.reg==='free'?'비규제 · 전세 끼고 매수 가능':'토지거래허가 · 실거주 2년'}</dd></div></dl></section>`;
  if(d.fit&&d.fit.length) h+=`<section class="sec"><h3>이런 사람에게</h3><div class="fit">${d.fit.map(f=>`<span>${esc(f)}</span>`).join('')}</div></section>`;
  if(d.check&&d.check.length) h+=`<section class="sec"><h3>사기 전에 확인</h3><ul class="checks">${d.check.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></section>`;
  h+=`<p class="fine">필요한 돈은 주담대 한도 6억과 LTV만 반영한 계산입니다. 실제 대출은 소득(DSR)에 따라 줄어듭니다. ${d.u||d.p0?'시세는 국토부 실거래 기준 최근 시세(3개월 중위 또는 시세지수 환산)로 매물 호가와 다를 수 있습니다.':'시세는 리치고 추정치로 매물 호가와 다를 수 있습니다.'} 상승률 출처: ${esc(src)}.</p>
  <div class="pfoot"><a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${encodeURIComponent(d.q)}">카카오맵에서 보기 ${ARROW}</a><a class="btn ghost" target="_blank" rel="noopener" href="https://m.land.naver.com/search/result/${encodeURIComponent(d.q)}">매물</a></div>`;
  const b=$('#body'); b.innerHTML=h; b.scrollTop=0;
  $('#back').onclick=()=>{close();render();};
}

function render(){ state.sel==null?renderList():renderDetail(state.sel); if(map) renderMap(); }
let qT=null;
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();state.lim=50;close();render(); clearTimeout(qT); qT=setTimeout(fitSearch,450);});
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ clearTimeout(qT); fitSearch(); e.target.blur(); if(mobile()) snapTo('half'); } });
function fitSearch(){
  if(!map||!state.q) return;
  const hit=D.filter(d=>d._pos&&visible(d));
  if(hit.length){ const b=new kakao.maps.LatLngBounds(); hit.forEach(d=>b.extend(d._pos));
    if(hit.length===1){ map.setLevel(5); map.setCenter(hit[0]._pos); } else map.setBounds(b,60,40,mobile()?Math.round($('#map').clientHeight*.5):40,40); return; }
  new kakao.maps.services.Places().keywordSearch(state.q,(r,st)=>{          // 단지가 없으면 지명으로 이동
    if(st!==kakao.maps.services.Status.OK) return; const h=r.find(x=>inMetro(+x.y,+x.x)); if(!h) return;
    map.setLevel(7); map.setCenter(new kakao.maps.LatLng(+h.y,+h.x)); });
}

let map,pins=[];
/* 핀 겹침 정리: 점수 높은 순으로 놓고, 화면에서 이미 놓인 핀과 겹치면 숨김. 확대하면 더 보임 */
let shownN=0;
function renderMap(){
  if(!map) return;
  const proj=map.getProjection(), W=$('#map').clientWidth, H=$('#map').clientHeight, placed=[];
  const far=map.getLevel()>8, pw=far?78:116, ph=far?30:40;
  const order=pins.slice().sort((a,b)=>(b.i===state.sel)-(a.i===state.sel)||D[b.i].score-D[a.i].score);
  shownN=0;
  let cand=0;
  order.forEach(o=>{ const d=D[o.i]; let on=false;
    const vis=o.i===state.sel||visible(d);
    if(vis&&o.i!==state.sel) cand++;
    if(vis&&(o.i===state.sel||(!(far&&!state.q&&cand>300)&&shownN<400))){
      const p=proj.containerPointFromCoords(d._pos);
      if(p.x>-pw&&p.x<W+pw&&p.y>-ph&&p.y<H+ph*2){
        const r=[p.x-pw/2,p.y-ph-6,p.x+pw/2,p.y-6];
        if(o.i===state.sel||!placed.some(q=>r[0]<q[2]&&r[2]>q[0]&&r[1]<q[3]&&r[3]>q[1])){ placed.push(r); on=true; shownN++; }
      }
    }
    if(on!==o.on){ o.ov.setMap(on?map:null); o.on=on; }
    o.el.classList.toggle('sel',o.i===state.sel); o.el.classList.toggle('far',far);
  });
  const c=$('#mapcount'); if(c){ const inV=pins.filter(o=>{ if(!visible(D[o.i])) return false; const p=proj.containerPointFromCoords(D[o.i]._pos); return p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H; }).length; c.textContent=shownN<inV?`이 화면 ${inV}곳 중 ${shownN}곳 표시 · 확대하면 더`:`이 화면 ${inV}곳`; }
}
function close(){ state.sel=null; }
function select(i,fromList){
  state.sel=i; render();
  if(mobile()) snapTo(fromList?'half':'half');
  const d=D[i];
  if(map&&d._pos){
    if(map.getLevel()>6) map.setLevel(6);
    const proj=map.getProjection(), pt=proj.containerPointFromCoords(d._pos), h=$('#map').clientHeight;
    const want=mobile()?h*0.28:h*0.5;
    map.panTo(proj.coordsFromContainerPoint(new kakao.maps.Point(pt.x, pt.y-want+h/2)));
  }
}
function pinHTML(d){ return `<div><span class="sc">${d.rank.toLocaleString()}위</span><span><b>${short(cashOf(d))}</b><small>${esc(d.s)}</small></span></div>`; }
function updatePins(){ pins.forEach(o=>{ const d=D[o.i]; o.el.style.setProperty('--chip',d.tier.c); o.el.innerHTML=pinHTML(d); o.ov.setZIndex(d.score); }); }
function addPin(i){
  const d=D[i], el=document.createElement('div');
  el.className='mk'; el.style.setProperty('--chip',d.tier.c);
  el.innerHTML=pinHTML(d);
  el.addEventListener('click',e=>{e.stopPropagation();select(i,false);});
  const ov=new kakao.maps.CustomOverlay({position:d._pos,content:el,xAnchor:0,yAnchor:0,zIndex:d.score,clickable:true});
  pins.push({i,ov,el,on:false});
}

/* ── 바텀시트 ── */
const sheet=$('#sheet'); let snaps={},cur='peek',y=0;
function calcSnaps(){
  sheet.style.height=(innerHeight-$('.masthead').offsetHeight-8)+'px';
  const H=sheet.offsetHeight; snaps={full:0,half:Math.round(H*0.45),peek:H-132};
}
function setY(v,anim){ y=Math.max(0,Math.min(snaps.peek,v)); sheet.classList.toggle('anim',!!anim); sheet.style.setProperty('--y',y+'px'); }
function snapTo(name){ if(!mobile())return; calcSnaps(); cur=name; setY(snaps[name],true); }
(function(){
  if(!mobile())return;
  calcSnaps(); setY(snaps.peek,false);
  let sy=0,sp=0,ly=0,lt=0,vel=0,drag=false,fromBody=false,moved=0;
  const body=$('#body'), head=$('#head');
  const down=(e,fb)=>{const t=e.touches[0];drag=true;fromBody=fb;sy=ly=t.clientY;sp=y;lt=performance.now();vel=0;moved=0;sheet.classList.remove('anim');};
  const move=e=>{
    if(!drag)return; const t=e.touches[0], dy=t.clientY-sy; moved=Math.max(moved,Math.abs(dy));
    if(fromBody){ if(y<=0&&(body.scrollTop>0||dy<0)){sy=t.clientY;sp=y;return;} if(e.cancelable)e.preventDefault(); }
    const now=performance.now(); vel=(t.clientY-ly)/Math.max(1,now-lt); ly=t.clientY; lt=now;
    setY(sp+dy,false);
  };
  const up=()=>{
    if(!drag)return; drag=false; if(moved<6) return;
    const order=['full','half','peek'];
    const near=order.slice().sort((a,b)=>Math.abs(snaps[a]-y)-Math.abs(snaps[b]-y))[0];
    let t=near;
    if(Math.abs(vel)>0.4){ const k=order.indexOf(near); t=order[Math.max(0,Math.min(2,k+(vel>0?1:-1)))]; if(vel<0&&y<snaps.half)t='full'; if(vel>0&&y>snaps.half)t='peek'; }
    snapTo(t);
  };
  head.addEventListener('touchstart',e=>down(e,false),{passive:true});
  head.addEventListener('touchmove',move,{passive:false});
  body.addEventListener('touchstart',e=>{ if(y>0||body.scrollTop<=0) down(e,true); },{passive:true});
  body.addEventListener('touchmove',e=>{ if(drag) move(e); },{passive:false});
  addEventListener('touchend',up); addEventListener('touchcancel',up);
  body.addEventListener('scroll',()=>{ if(y>0) body.scrollTop=0; });
  head.addEventListener('click',()=>{ if(moved<6) snapTo(cur==='full'?'peek':cur==='half'?'full':'half'); });
  $('#q').addEventListener('focus',()=>snapTo('full'));
  addEventListener('resize',()=>{calcSnaps();setY(snaps[cur],false);});
})();

recompute();
render();

(function(){
  const s=document.createElement('script');
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
  s.onerror=()=>{const m=$('#keymsg');m.style.display='flex';m.textContent='지도를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';};
  s.onload=()=>kakao.maps.load(init);
  document.head.append(s);
})();
const inMetro=(la,ln)=>la>36.85&&la<38.3&&ln>126.3&&ln<127.95;
const NEWGU=/병점구|동탄구|효행구|만세구|서해구|검단구|영종구|제물포구/;   // 2026 신설 구: 지도 주소엔 아직 없을 수 있음
function addrOK(d,a){ const t=d.area.split(' ').slice(0,-1).filter(x=>!NEWGU.test(x)).map(x=>x.replace(/(시|군)$/,'')); return t.every(x=>a.includes(x)); }
function init(){
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(37.45,127.0),level:9});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  kakao.maps.event.addListener(map,'click',()=>{ if(mobile()) snapTo('peek'); });
  const places=new kakao.maps.services.Places(),bounds=new kakao.maps.LatLngBounds();
  let pending=D.length;
  const done=()=>{ if(--pending===0&&!bounds.isEmpty()) map.setBounds(bounds,60,40,mobile()?150:40,40); };
  const done2=()=>{ done(); if(pending===0) analyze(); };
  (function fut(){
    const c=GEO.__fut2;
    if(FUT.every(f=>f[3])){ FUTPOS=FUT.map(f=>f[3]); recompute(); render(); return; }   // 2026.10: 역 좌표를 OSM 공사·계획 역 위치로 고정(이름 검색 좌표는 신설역에서 틀림)
    if(c&&c.length===FUT.length&&c.every(Boolean)){ FUTPOS=c; recompute(); render(); return; }
    const out=(c&&c.length===FUT.length)?c.slice():Array(FUT.length).fill(null);
    const todo=FUT.map((f,k)=>k).filter(k=>!out[k]); let n=0;
    const step=()=>{ if(n>=todo.length){ FUTPOS=out; GEO.__fut2=out; saveGeo(); recompute(); render(); return; }
      const k=todo[n++], tries=[FUT[k][0],FUT[k][0].split(' ')[0]];
      const go=(t,left)=>places.keywordSearch(t,(r,st)=>{
        if(st===kakao.maps.services.Status.OK&&r.length){ const h=r.find(x=>/지하철|기차|역/.test(x.category_name+x.place_name))||r[0]; out[k]=[+h.y,+h.x]; setTimeout(step,80); }
        else if(left>1) setTimeout(()=>go(tries[tries.length-left+1],left-1),300);
        else setTimeout(step,80);
      });
      go(tries[0],tries.length); };
    setTimeout(step,1500);
  })();
  /* 단지 위치: 수도권 범위 + 주소에 시·구가 맞는 결과만 채택(동명 단지가 대전·전남에 찍히던 문제) */
  const geoQ=[]; let geoActive=0;
  const pump=()=>{ while(geoActive<3&&geoQ.length){ const f=geoQ.shift(); geoActive++; f(()=>{ geoActive--; setTimeout(pump,60); }); } };
  const locate=(d,cb)=>{ const tries=[d.q,`${d.area} ${d.n.replace(/^\S+동 /,'')}`,`${d.area.split(' ').slice(-2).join(' ')} ${d.n.replace(/^\S+동 /,'')} 아파트`]; let k=0;
    const go=()=>{ if(k>=tries.length) return cb(null);
      places.keywordSearch(tries[k++],(res,st)=>{
        if(st===kakao.maps.services.Status.OK){ const ok=res.filter(r=>inMetro(+r.y,+r.x)&&addrOK(d,r.address_name||r.road_address_name||''));
          const hit=ok.find(r=>/아파트|주거/.test(r.category_name))||ok[0]; if(hit) return cb(hit); }
        setTimeout(go,120); },{rect:'126.3,36.85,127.95,38.3'}); };
    go(); };
  const place=(d,i,lat,lng)=>{ d._pos=new kakao.maps.LatLng(lat,lng); bounds.extend(d._pos); if(!pins.some(o=>o.i===i)) addPin(i); else { const o=pins.find(o=>o.i===i); o.ov.setPosition(d._pos); } };
  D.forEach((d,i)=>{
    const g=GEO[gkey(d)];
    if(d.lat){ place(d,i,d.lat,d.lng); done2(); return; }
    if(g&&g.lat&&g.gv&&g.cat!=null&&inMetro(g.lat,g.lng)){ place(d,i,g.lat,g.lng); done2(); return; }
    if(g&&g.lat&&inMetro(g.lat,g.lng)) place(d,i,g.lat,g.lng);            // 일단 표시하고 재확인
    geoQ.push(fin=>locate(d,hit=>{
      if(hit){ const lat=+hit.y,lng=+hit.x, old=GEO[gkey(d)]||{};
        const moved=!old.lat||hav(old.lat,old.lng,lat,lng)>300;
        const cat=hit.category_name||'';
        GEO[gkey(d)]=moved?{lat,lng,gv:1,cat}:Object.assign(old,{lat,lng,gv:1,cat});   // 위치가 바뀌면 역·학교 분석 다시
        place(d,i,lat,lng); }
      else if(g&&!inMetro(g.lat||0,g.lng||0)){ delete GEO[gkey(d)]; const o=pins.find(o=>o.i===i); if(o){ o.ov.setMap(null); pins.splice(pins.indexOf(o),1);} d._pos=null; }
      done2(); fin(); }));
  });
  pump();
  function analyze(){
    const ps=new kakao.maps.services.Places(), OK=kakao.maps.services.Status.OK, ZERO=kakao.maps.services.Status.ZERO_RESULT, DIST=kakao.maps.services.SortBy.DISTANCE;
    const todo=D.filter(d=>{const g=GEO[gkey(d)];return d._pos&&!(g&&g.sc!=null&&g.sts!=null&&g.ac!=null);});
    let idx=0, active=0, tick=0;
    const q=(fn)=>new Promise(r=>fn(r));
    const one=async d=>{
      const g=GEO[gkey(d)]=Object.assign(GEO[gkey(d)]||{},{lat:d._pos.getLat(),lng:d._pos.getLng()});
      if(g.sts==null) await q(done=>ps.categorySearch('SW8',(r,st)=>{
        if(st===OK&&r.length){g.st=+r[0].distance;g.stn=r[0].place_name.replace(/ \S+선$/,'');g.slat=+r[0].y;g.slng=+r[0].x;g.sts=r.map(x=>[x.place_name,+x.distance]);} else if(st===ZERO){g.st=99999;g.sts=[];} done();
      },{location:d._pos,radius:3000,sort:DIST}));
      if(g.sc==null) await q(done=>ps.keywordSearch('초등학교',(r2,st2)=>{
        const e=st2===OK?r2.filter(x=>/초등학교$/.test(x.place_name)):[];
        if(e.length){g.sc=+e[0].distance;g.scn=e[0].place_name;} else if(st2===OK||st2===ZERO) g.sc=99999; done();
      },{location:d._pos,radius:1500,sort:DIST}));
      if(g.ac==null) await q(done=>ps.categorySearch('AC5',(r3,st3,pg)=>{
        if(st3===OK) g.ac=(pg&&pg.totalCount)||r3.length; else if(st3===ZERO) g.ac=0; done();
      },{location:d._pos,radius:1000}));
    };
    const finish=()=>{ saveGeo(); elevation(); };
    const pump=()=>{ while(active<6&&idx<todo.length){ const d=todo[idx++]; active++;
      one(d).then(()=>{ active--; if(++tick%20===0){ saveGeo(); recompute(); render(); }
        if(idx>=todo.length&&active===0) finish(); else pump(); }); } };
    if(todo.length) pump(); else elevation();
  }
  async function elevation(){
    const need=D.filter(d=>{const g=GEO[gkey(d)];return g&&g.slat&&g.dh==null;});
    for(let k=0;k<need.length;k+=50){
      const part=need.slice(k,k+50), lat=[], lng=[];
      part.forEach(d=>{const g=GEO[gkey(d)];lat.push(g.lat.toFixed(5),g.slat.toFixed(5));lng.push(g.lng.toFixed(5),g.slng.toFixed(5));});
      try{
        const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat.join(',')}&longitude=${lng.join(',')}`);
        const j=await r.json();
        part.forEach((d,n)=>{const g=GEO[gkey(d)];const a=j.elevation[n*2],b=j.elevation[n*2+1];if(a!=null&&b!=null)g.dh=a-b;});
      }catch(e){}
    }
    saveGeo(); recompute(); render();
  }
  kakao.maps.event.addListener(map,'idle',renderMap);
}
</script>

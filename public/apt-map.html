<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>6억 이하 특이점 단지 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f3ef;--panel:#fff;--fg:#141417;--muted:#6e6e76;--line:#ecebe6;--soft:#f6f5f2;--good:#16865c;--bad:#c2452d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--fg);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;letter-spacing:-.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;z-index:5}
header h1{font-size:17px;font-weight:750}
header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed=false]{opacity:.35}

main{flex:1;display:flex;min-height:0;position:relative}
.mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0}
#keymsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.7;padding:24px;color:var(--muted);z-index:2;background:var(--bg)}

aside{width:420px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:6}
.sheet-head{flex:none}
.grab{display:none}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;background:var(--soft)}
.body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.item{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:active{background:var(--soft)}
.item .row{display:flex;gap:8px;align-items:baseline}
.item .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tg{font-size:11px;color:var(--muted);white-space:nowrap}
.item .pr{margin-left:auto;font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .hl{font-size:13.5px;margin-top:4px;line-height:1.45;font-weight:600}
.item .meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;color:#fff}

.detail{padding:4px 18px 40px}
.back{font-size:13px;color:var(--muted);padding:10px 0 6px}
.d-tags{display:flex;gap:5px;flex-wrap:wrap}
.d-name{font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.d-area{font-size:13px;color:var(--muted);margin-top:3px}
.hero{margin-top:14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#1c1c22,#2c2b33);color:#fff}
.hero .h{font-size:18px;font-weight:800;line-height:1.38;letter-spacing:-.5px}
.hero .s{font-size:13.5px;line-height:1.6;color:#d7d6dc;margin-top:8px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.m{background:var(--soft);border-radius:12px;padding:11px 12px}
.m .l{font-size:11.5px;color:var(--muted)}
.m .v{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.m .x{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.m.hi{background:#fff4ec}
.m.hi .v{color:#c2452d}
.sec{margin-top:22px}
.sec h3{font-size:14.5px;font-weight:800;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.sec h3 .n{width:20px;height:20px;border-radius:6px;background:#141417;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:118px 1fr 58px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:22px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:#c9c6be}
.bar.me .t i{background:var(--c)}
.bar.me{font-weight:700}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.cmpnote{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.steps{display:flex;gap:4px;margin-top:2px}
.steps div{flex:1;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.3}
.steps div::before{content:"";display:block;height:6px;border-radius:3px;background:#e4e2dc;margin-bottom:6px}
.steps .done::before{background:#8a4fd8}
.steps .now{color:#141417;font-weight:700}
.steps .now::before{background:linear-gradient(90deg,#8a4fd8 50%,#e4e2dc 50%)}
.stnote{font-size:12.5px;margin-top:9px;background:#f4effc;color:#4b2c80;border-radius:8px;padding:8px 10px}
.tl{list-style:none;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:14px;width:2px;background:#e4e2dc}
.tl li{position:relative;display:grid;grid-template-columns:22px 64px 1fr;padding-bottom:12px;font-size:13.5px;line-height:1.45}
.tl li::before{content:"";width:8px;height:8px;margin-top:5px;border-radius:50%;background:#fff;border:2px solid var(--c,#2f6fde);position:relative;z-index:1}
.tl b{font-size:12px;color:var(--muted);font-weight:700;padding-top:1px}
.fit{display:flex;flex-wrap:wrap;gap:6px}
.fit span{font-size:12.5px;background:#eef6f1;color:#185c3e;border-radius:999px;padding:6px 10px}
.chk{list-style:none;display:flex;flex-direction:column;gap:7px}
.chk li{font-size:13.5px;line-height:1.5;padding-left:20px;position:relative;color:#4a3530}
.chk li::before{content:"!";position:absolute;left:4px;top:0;font-weight:800;color:var(--bad)}
.ceil{display:flex;justify-content:space-between;gap:10px;margin-top:10px;border:1px dashed #cfcac0;border-radius:12px;padding:10px 12px}
.ceil .l{font-size:11.5px;color:var(--muted)}
.ceil .v{font-size:16px;font-weight:800;margin-top:2px}
.ceil .r{text-align:right}
.pin.auto{background:#fff;color:var(--c);border:2px solid var(--c);padding:2px 7px 3px}
.pin.auto::after{border-top-color:var(--c)}
.cnt{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.fine{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.55}

.pin{background:var(--c);color:#fff;border-radius:9px;padding:4px 8px 5px;min-width:54px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.22);transform:translate(-50%,-100%) translateY(-8px);cursor:pointer;font-family:Pretendard,sans-serif;position:relative;line-height:1.15}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c);border-bottom:0}
.pin b{display:block;font-size:13px;font-weight:800;letter-spacing:-.3px}
.pin small{display:block;font-size:10px;font-weight:600;opacity:.92;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.pin.mini small{display:none}
.pin.mini{padding:3px 7px;min-width:0}
.pin.hide{display:none}
.card{width:250px;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);transform:translate(-50%,calc(-100% - 14px));font-family:Pretendard,sans-serif;cursor:pointer;position:relative}
.card::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#141417;border-bottom:0}
.card .top{padding:11px 13px 9px;border-top:4px solid;border-radius:14px 14px 0 0}
.card .nm{font-size:14.5px;font-weight:800;padding-right:18px}
.card .ar{font-size:11px;color:var(--muted);margin-top:1px}
.card .hl{font-size:13px;font-weight:700;margin-top:7px;line-height:1.4}
.card .nums{display:flex;border-top:1px solid var(--line)}
.card .nums>div{flex:1;padding:8px 12px}
.card .nums>div+div{border-left:1px solid var(--line)}
.card .nums .l{font-size:10.5px;color:var(--muted)}
.card .nums .v{font-size:14px;font-weight:800;margin-top:1px}
.card .go{display:block;text-align:center;font-size:12.5px;font-weight:700;padding:9px;background:#141417;color:#fff;border-radius:0 0 14px 14px}
.card .x{position:absolute;right:6px;top:8px;width:24px;height:24px;color:#999;font-size:16px}

@media (max-width:800px){
  header{padding:10px 12px 9px;flex-direction:column;align-items:stretch;gap:7px}
  header>*{min-width:0;max-width:100%}
  header h1{font-size:15.5px}
  header .sub{font-size:11px}
  .chips{margin-left:0;overflow-x:auto;width:100%;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  aside{position:fixed;left:0;right:0;bottom:0;width:100%;border:none;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);transform:translateY(var(--y,60dvh));will-change:transform}
  aside.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .sheet-head{touch-action:none}
  .grab{display:flex;justify-content:center;padding:9px 0 3px}
  .grab span{width:40px;height:5px;border-radius:3px;background:#d4d0c8}
  .search{padding:6px 12px 10px}
  .search input{font-size:16px}
  .body{padding-bottom:env(safe-area-inset-bottom)}
  .card{width:236px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>6억 이하, 남들이 아직 안 본 단지</h1>
    <div class="sub">리치고 시세·국토부 실거래 · 2026.10.20 기준</div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="mapwrap"><div id="map"></div><div id="keymsg"></div></div>
  <aside id="sheet">
    <div class="sheet-head" id="head">
      <div class="grab"><span></span></div>
      <div class="search"><input id="q" placeholder="단지·동네 검색" autocomplete="off"></div>
    </div>
    <div class="body" id="body"></div>
  </aside>
</main>

<script src="apt-data.js"></script>
<script src="apt-auto.js"></script>
<script>
D.push(...(window.AUTO||[]));
const KAKAO_JS_KEY='106bb734e8600621686fade2de7f8afb';
const $=s=>document.querySelector(s);
const mobile=()=>matchMedia('(max-width:800px)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eok=v=>{ if(v==null) return '—'; let e=Math.floor(v/10000), m=Math.round(v%10000/100)*100;
  if(m>=10000){e++;m=0;} return e? (m? `${e}억 ${m.toLocaleString()}` : `${e}억`) : `${m.toLocaleString()}만`; };
const short=v=>v==null?'—':(Math.round(v/1000)/10)+'억';

function ceilOf(d){
  if(d.ceil) return d.ceil;
  const t=d.area.split(' '), k=t[t.length-2]+'|'+t[t.length-1];
  return (window.BENCH&&BENCH[k])? BENCH[k]*34 : null;
}
function pyNum(d){const m=String(d.py).match(/\d+/);return m?+m[0]:null;}
function money(d){
  if(d.reg==='villa'||d.p==null) return null;
  const P=d.p, cap=60000, r={};
  if(d.reg==='free'){
    r.loan=Math.min(P*.7,cap); r.cash=P-r.loan; r.loanNote='비규제 LTV 70%';
    if(d.jeon){ r.gap=P-d.jeon; r.gapNote=`전세 ${eok(d.jeon)} 끼고 (전세가율 ${Math.round(d.jeon/P*100)}%)`; }
  } else {
    r.loan=Math.min(P*.4,cap); r.cash=P-r.loan; r.first=P-Math.min(P*.7,cap); r.loanNote='규제지역 LTV 40%';
  }
  return r;
}

const state={on:new Set(Object.keys(CATS)),q:'',sel:null};
const visible=d=>d.cat.some(c=>state.on.has(c))&&(!state.q||(d.n+d.area+(d.tagline||'')+d.headline).includes(state.q));

function renderChips(){
  const h=$('#chips');h.innerHTML='';
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement('button');b.className='chip';b.title=v.desc;b.setAttribute('aria-pressed',state.on.has(k));
    b.innerHTML=`<i style="background:${v.hex}"></i>${v.label} <span style="color:#999">${D.filter(d=>d.cat.includes(k)).length}</span>`;
    b.onclick=()=>{state.on.has(k)?state.on.delete(k):state.on.add(k);close();render();};
    h.append(b);
  });
}
const pills=d=>d.cat.map(c=>`<span class="pill" style="background:${CATS[c].hex}">${CATS[c].label}</span>`).join('');
const priceLabel=d=>d.p==null?d.py:`${d.py} ${short(d.p)}`;

function renderList(){
  const b=$('#body');b.innerHTML='';
  const nv=D.filter(visible).length, nc=D.filter(d=>visible(d)&&!d.auto).length;
  const h=document.createElement('div');h.className='cnt';h.textContent=`${nv}개 단지 · 직접 분석 ${nc} + 기준 자동선별 ${nv-nc}`;b.append(h);
  D.forEach((d,i)=>{
    if(!visible(d))return;
    const el=document.createElement('div');el.className='item';
    el.innerHTML=`<div class="row"><span class="nm">${esc(d.n)}</span>${d.tagline?`<span class="tg">${esc(d.tagline)}</span>`:''}<span class="pr">${esc(priceLabel(d))}</span></div>
      <div class="hl">${esc(d.headline)}</div>
      <div class="meta">${pills(d)}<span>${esc(d.area)}</span></div>`;
    el.onclick=()=>select(i,true);
    b.append(el);
  });
}

function renderDetail(i){
  const d=D[i], c=CATS[d.cat[0]].hex, m=money(d);
  let n=0; const H=t=>`<h3><span class="n">${++n}</span>${t}</h3>`;
  let html=`<div class="detail" style="--c:${c}">
    <button class="back" id="back">‹ 전체 목록</button>
    <div class="d-tags">${pills(d)}</div>
    <div class="d-name">${esc(d.n)}${d.tagline?` <span style="font-size:13px;color:var(--muted);font-weight:600">${esc(d.tagline)}</span>`:''}</div>
    <div class="d-area">${esc(d.area)}${d.year?` · ${d.year}년 입주`:''}${d.units?` · ${d.units.toLocaleString()}세대`:''}</div>
    <div class="hero"><div class="h">${esc(d.headline)}</div><div class="s">${esc(d.sub)}</div></div>`;
  const ce=ceilOf(d), pn=pyNum(d);
  if(ce&&d.p&&pn){
    const mp=(d.auto&&d.cmp&&d.cmp.rows[0]&&d.cmp.rows[0][2])?d.cmp.rows[0][1]:d.p/pn;const ratio=Math.round(mp/(ce/34)*100);
    html+=`<div class="ceil"><div><div class="l">입지 천장 · 이 동네 새 아파트 34평</div><div class="v">약 ${eok(Math.round(ce/100)*100)}</div></div><div class="r"><div class="l">평당가로 보면</div><div class="v">천장의 ${ratio}%</div></div></div>`;
  }
  if(m){
    html+=`<div class="money"><div class="m"><div class="l">${esc(d.py)} 시세</div><div class="v">${eok(d.p)}</div></div>`;
    if(m.gap!=null) html+=`<div class="m hi"><div class="l">전세 끼면 필요한 돈</div><div class="v">${eok(m.gap)}</div><div class="x">${esc(m.gapNote)}</div></div>`;
    else if(m.first!=null) html+=`<div class="m hi"><div class="l">생애최초 대출 시 필요한 돈</div><div class="v">${eok(m.first)}</div><div class="x">LTV 70% · 2년 실거주</div></div>`;
    else html+=`<div class="m hi"><div class="l">대출 끼면 필요한 돈</div><div class="v">${eok(m.cash)}</div><div class="x">${esc(m.loanNote)}</div></div>`;
    html+=`</div><div class="money" style="margin-top:8px">`;
    if(m.first!=null) html+=`<div class="m"><div class="l">일반 대출 시</div><div class="v" style="font-size:15px">${eok(m.cash)}</div><div class="x">${esc(m.loanNote)}</div></div><div class="m"><div class="l">규제</div><div class="v" style="font-size:15px">토허·실거주</div><div class="x">전세 끼고 매수 불가</div></div>`;
    else html+=`<div class="m"><div class="l">실거주 · 대출 끼면</div><div class="v" style="font-size:15px">${eok(m.cash)}</div><div class="x">${esc(m.loanNote)}</div></div><div class="m"><div class="l">규제</div><div class="v" style="font-size:15px">없음</div><div class="x">전세 끼고 매수 가능</div></div>`;
    html+=`</div>`;
  }
  if(d.cmp){
    const pct=d.cmp.unit==='%', max=Math.max(...d.cmp.rows.map(r=>r[1]));
    html+=`<div class="sec">${H(pct?'왜 이 구역인가':'왜 싸게 사는 건가')}<div style="font-size:12px;color:var(--muted);margin:-4px 0 9px">${esc(d.cmp.title)}${pct?'':' · 평당 만원'}</div><div class="bars">`+
      d.cmp.rows.map(r=>`<div class="bar${r[2]?' me':''}"><span>${esc(r[0])}</span><div class="t"><i style="width:${Math.round(r[1]/max*100)}%"></i></div><span class="v">${r[1].toLocaleString()}${pct?'%':''}</span></div>`).join('')+
      `</div>${d.cmp.note?`<div class="cmpnote">${esc(d.cmp.note)}</div>`:''}</div>`;
  }
  if(!d.stage&&d.stage_text) html+=`<div class="sec">${H('재건축 어디까지 왔나')}<div class="stnote">${esc(d.stage_text)}</div></div>`;
  if(d.stage){
    html+=`<div class="sec">${H('재건축 어디까지 왔나')}<div class="steps">`+
      d.stage.steps.map((s,k)=>`<div class="${k<d.stage.at?'done':k===d.stage.at?'now':''}">${esc(s)}</div>`).join('')+
      `</div><div class="stnote">${esc(d.stage.note)}</div></div>`;
  }
  if(d.timeline&&d.timeline.length) html+=`<div class="sec">${H('앞으로 바뀌는 것')}<ul class="tl">`+d.timeline.map(t=>`<li><b>${esc(t[0])}</b> ${esc(t[1])}</li>`).join('')+`</ul></div>`;
  html+=`<div class="sec">${H('이런 사람한테 맞아')}<div class="fit">${d.fit.map(f=>`<span>${esc(f)}</span>`).join('')}</div></div>`;
  html+=`<div class="sec">${H('사기 전에 꼭 확인')}<ul class="chk">${d.check.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`;
  if(d.deal) html+=`<div class="fine">${esc(d.deal)}</div>`;
  html+=`<div class="fine">필요한 돈은 주담대 한도 6억과 LTV만 반영한 단순 계산이야. 실제 대출은 소득(DSR)에 따라 줄어들 수 있고, 시세는 리치고 추정치라 매물 호가와 다를 수 있어.</div></div>`;
  const b=$('#body'); b.innerHTML=html; b.scrollTop=0;
  $('#back').onclick=()=>{close();render();};
}

function render(){renderChips(); state.sel==null?renderList():renderDetail(state.sel); if(map) renderMap();}
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();close();render();});

let map,pins=[],cardOv=null;
function renderMap(){ pins.forEach(o=>o.ov.setMap(visible(D[o.i])?map:null)); }
function close(){ state.sel=null; if(cardOv){cardOv.setMap(null);cardOv=null;} pins.forEach(o=>o.el.classList.remove('hide')); }

function showCard(i){
  if(!map||!D[i]._pos) return;
  if(cardOv) cardOv.setMap(null);
  const d=D[i], c=CATS[d.cat[0]].hex, m=money(d);
  const second = m ? (m.gap!=null?['전세 끼면',eok(m.gap)]:m.first!=null?['생애최초 대출 시',eok(m.first)]:['대출 끼면',eok(m.cash)]) : ['진행 단계',d.stage?d.stage.steps[d.stage.at]:'—'];
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<button class="x" aria-label="닫기">×</button><div class="top" style="border-top-color:${c}"><div class="nm">${esc(d.n)}</div><div class="ar">${esc(d.area)}</div><div class="hl">${esc(d.headline)}</div></div>
    <div class="nums"><div><div class="l">${esc(d.py)}</div><div class="v">${d.p==null?'지분':eok(d.p)}</div></div><div><div class="l">${esc(second[0])}</div><div class="v" style="color:#c2452d">${esc(second[1])}</div></div></div>
    <span class="go">투자 포인트 자세히 ›</span>`;
  el.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();close();render();});
  el.addEventListener('click',e=>{e.stopPropagation(); if(mobile()) snapTo('full');});
  cardOv=new kakao.maps.CustomOverlay({position:d._pos,content:el,xAnchor:0,yAnchor:0,zIndex:20,clickable:true});
  cardOv.setMap(map);
  pins.forEach(o=>o.el.classList.toggle('hide',o.i===i));
}

function select(i,fromList){
  state.sel=i; render();
  const d=D[i];
  if(mobile()) snapTo(fromList?'half':'peek');
  showCard(i);
  if(map&&d._pos){
    if(map.getLevel()>6) map.setLevel(6);
    const proj=map.getProjection(), pt=proj.containerPointFromCoords(d._pos), h=$('#map').clientHeight;
    // 카드가 화면 위쪽 절반에 오도록: 좌표를 화면 아래쪽(62%)에 배치
    const want = mobile()? (fromList? h*0.42 : h*0.62) : h*0.62;
    const center=proj.coordsFromContainerPoint(new kakao.maps.Point(pt.x, pt.y - want + h/2));
    map.panTo(center);
  }
}

function addPin(i){
  const d=D[i],c=CATS[d.cat[0]].hex;
  const el=document.createElement('div');el.className='pin'+(d.auto?' auto':'');el.style.setProperty('--c',c);
  el.innerHTML=`<b>${esc(d.p==null?'지분':short(d.p))}</b><small>${esc(d.s||d.n)}</small>`;
  el.addEventListener('click',e=>{e.stopPropagation();select(i,false);});
  const ov=new kakao.maps.CustomOverlay({position:d._pos,content:el,xAnchor:0,yAnchor:0,zIndex:3,clickable:true});
  pins.push({i,ov,el}); ov.setMap(visible(d)?map:null);
}

/* 바텀시트 */
const sheet=$('#sheet'); let snaps={},cur='peek',y=0;
function calcSnaps(){
  sheet.style.height=(innerHeight-document.querySelector('header').offsetHeight-6)+'px';
  const H=sheet.offsetHeight; snaps={full:0,half:Math.round(H*0.42),peek:H-150};
}
function setY(v,anim){ y=Math.max(0,Math.min(snaps.peek,v)); sheet.classList.toggle('anim',!!anim); sheet.style.setProperty('--y',y+'px'); }
function snapTo(name){ if(!mobile())return; calcSnaps(); cur=name; setY(snaps[name],true); }
(function(){
  if(!mobile())return;
  calcSnaps(); setY(snaps.peek,false);
  let sy=0,sp=0,ly=0,lt=0,vel=0,drag=false,fromBody=false,moved=0;
  const body=$('#body'), head=$('#head');
  const down=(e,fb)=>{const t=e.touches[0];drag=true;fromBody=fb;sy=ly=t.clientY;sp=y;lt=performance.now();vel=0;moved=0;sheet.classList.remove('anim');};
  const move=e=>{
    if(!drag)return; const t=e.touches[0], dy=t.clientY-sy; moved=Math.max(moved,Math.abs(dy));
    if(fromBody){ if(y<=0&&(body.scrollTop>0||dy<0)){sy=t.clientY;sp=y;return;} if(e.cancelable)e.preventDefault(); }
    const now=performance.now(); vel=(t.clientY-ly)/Math.max(1,now-lt); ly=t.clientY; lt=now;
    setY(sp+dy,false);
  };
  const up=()=>{
    if(!drag)return; drag=false; if(moved<6) return;
    const order=['full','half','peek'];
    const near=order.slice().sort((a,b)=>Math.abs(snaps[a]-y)-Math.abs(snaps[b]-y))[0];
    let t=near;
    if(Math.abs(vel)>0.4){ const k=order.indexOf(near); t=order[Math.max(0,Math.min(2,k+(vel>0?1:-1)))]; if(vel<0&&y<snaps.half)t='full'; if(vel>0&&y>snaps.half)t='peek'; }
    snapTo(t);
  };
  head.addEventListener('touchstart',e=>down(e,false),{passive:true});
  head.addEventListener('touchmove',move,{passive:false});
  body.addEventListener('touchstart',e=>{ if(y>0||body.scrollTop<=0) down(e,true); },{passive:true});
  body.addEventListener('touchmove',e=>{ if(drag) move(e); },{passive:false});
  addEventListener('touchend',up); addEventListener('touchcancel',up);
  body.addEventListener('scroll',()=>{ if(y>0) body.scrollTop=0; });
  head.addEventListener('click',e=>{ if(e.target.tagName!=='INPUT'&&moved<6) snapTo(cur==='full'?'peek':cur==='half'?'full':'half'); });
  $('#q').addEventListener('focus',()=>snapTo('full'));
  addEventListener('resize',()=>{calcSnaps();setY(snaps[cur],false);});
})();

render();

(function(){
  const s=document.createElement('script');
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
  s.onerror=()=>{const m=$('#keymsg');m.style.display='flex';m.textContent='지도를 불러오지 못했어. 잠시 후 새로고침해줘.';};
  s.onload=()=>kakao.maps.load(init);
  document.head.append(s);
})();
function init(){
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(37.5,126.95),level:9});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  kakao.maps.event.addListener(map,'click',()=>{ if(state.sel!=null){close();render();} if(mobile()) snapTo('peek'); });
  const places=new kakao.maps.services.Places(),bounds=new kakao.maps.LatLngBounds();
  let pending=D.length;
  const done=()=>{ if(--pending===0&&!bounds.isEmpty()) map.setBounds(bounds,60,40,mobile()?170:40,40); };
  D.forEach((d,i)=>{
    if(d.lat){d._pos=new kakao.maps.LatLng(d.lat,d.lng);bounds.extend(d._pos);addPin(i);done();return;}
    places.keywordSearch(d.q||d.n,(res,st)=>{
      if(st===kakao.maps.services.Status.OK){d._pos=new kakao.maps.LatLng(+res[0].y,+res[0].x);bounds.extend(d._pos);addPin(i); if(state.sel===i) showCard(i);}
      done();
    });
  });
  kakao.maps.event.addListener(map,'zoom_changed',()=>{const far=map.getLevel()>8;pins.forEach(o=>o.el.classList.toggle('mini',far));});
}
</script>
